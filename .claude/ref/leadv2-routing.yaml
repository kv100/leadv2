# ==============================================================================
# TENANT DELTA for the plugin's own repo — PLUGIN-REPO-CARRIES-A-SHADOW-
# ROUTING-CONFIG-01 (row 85e7878c), 2026-09-10.
#
# This file is NO LONGER a copy of plugins/leadv2/config/leadv2-routing.yaml.
# Until 2026-09-10 it was a 558-line hand-made copy (made 2026-09-05 for ONE
# adjusted block), drifted 229 lines behind canonical, and it SUBSTITUTED the
# canonical registry for every reader in this repo — so routing orders written
# into canonical (capability_matrix cells, dispatch_ladder, quota posture)
# did not act on plugin lanes. A copy that must be kept in sync IS the defect;
# the copy is deleted on purpose.
#
# How this file is read now: lib/leadv2-routing-config.sh (the ONE resolver)
# MERGES this delta over the canonical registry via lib/leadv2-routing-merge.py
# and materializes the result (cached, atomic). Rules, one and only one set:
#   - a key ABSENT here is inherited from canonical;
#   - a key PRESENT here wins;
#   - a list PRESENT here REPLACES the canonical list entirely (a tenant must
#     be able to REMOVE a ladder row, not only add one).
# Each build writes one journal line to stderr naming canonical, tenant and
# the overridden-key count: "[leadv2-routing-config] merged ...". The old
# substitution was silent — that is why it survived five weeks.
#
# Only what this repo actually overrides lives here. Every copied line is a
# future silently-ignored order.
#
# The full per-decision authority map that this file's 558-line predecessor
# carried is history now: docs/handoff/ROUTING-YAML-HAS-TWO-READERS-AND-TWO-
# FILES-01/report.md keeps the 2026-09-05 census. What survives from it:
#   - the router registry (this document) resolves through
#     lib/leadv2-routing-config.sh — merge, everywhere;
#   - the phase-policy document (phases/stop_rules/floor_rules) resolves by
#     SHAPE through lib/leadv2-phase-policy-path.sh — unrelated to this tier;
#   - leadv2-route-arbiter.sh still reads the plugin config directly
#     (untouched by this task, lane 10ee163f7a3e owns it);
#   - leadv2-quota-read.py still reads router_v2.active_account from the
#     plugin copy only.
#
# Parse discipline for the delta and the materialized merge: key names and
# the two-space glm_policy: indentation stay load-bearing —
# lib/leadv2-review-signals.sh reads protected_path_patterns with a REGEX and
# leadv2-glm-policy-resolve.py with yaml.safe_load. Do not reformat.
# ==============================================================================
router:
  glm_policy:
    # RECOVER-WAVE1-TEN-01 union (2026-09-05), kept verbatim from the copy
    # this delta replaces: the shipped default patterns (safety/publish/
    # payments) PLUS this repo's own surface globs. This repo has no DB/auth/
    # payments — what breaks every consuming repo at once is the dispatch/
    # gate/hook surface, protected here; the shipped generic patterns are kept
    # so nothing the default guarded is silently unprotected. Deliberately NOT
    # protected: docs/** and plugins/leadv2/skills/**/*.md (markdown-only edits
    # do not warrant a safety-tier review).
    #
    # This list REPLACES canonical's (list-replace rule) — so it MUST stay a
    # SUPERSET of the canonical defaults; if canonical grows a default glob and
    # this list does not, tests/test-routing-config-merge.sh REDS and names the
    # missing glob. That drift is the one place inheritance cannot help (a
    # present list wins), so the test is the guard.
    # Glob syntax: `*` spans `/` (lib/leadv2-review-signals.sh).
    protected_path_patterns:
      - "*safety-gate*"
      - "*safety_gate*"
      - "*safety*gate*"
      - "*publish*"
      - "*payments*"
      - "*payment*"
      - "plugins/leadv2/scripts/*"
      - "plugins/leadv2/hooks/*"
      - "plugins/leadv2/config/*"
      - ".claude/settings.json"

  # FOUNDER ORDER 2026-09-16: "можешь делать всю работу только на двух
  # аккаунтах claude + glm? codex пока не трогай". List-replace rule applies,
  # so this ladder REPLACES canonical's entirely — that is how a tenant removes
  # an arm. Dropped: codex (named in the order), kimi (a third provider, and
  # already being retired — see the census-red suite "dispatch arm vocabulary
  # (kimi retirement)"), freepool (a third-party pool, `untrusted: true`).
  # Kept: the GLM arms and the Anthropic arms, with canonical's own `when:`
  # and `effort:` values copied unchanged.
  #
  # SCOPE: read only when PROJECT_ROOT resolves to this repo. Lanes dispatched
  # from persona-engine keep the canonical ladder, so the V5-M1 lanes running
  # there are untouched. REVERSAL is one step: delete this block.
  dispatch_ladder:
    - id: glm
      provider: glm
      model: glm-5.3
      when: [all]
      effort: standard
    - id: glm-flash
      provider: glm
      model: glm-5.3-flash
      when: [all]
      effort: standard
    - id: sonnet
      provider: anthropic
      model: sonnet
      when: [all]
      effort: standard
    - id: haiku
      provider: anthropic
      model: haiku
      when: [review]
      effort: standard
    - id: opus
      provider: anthropic
      model: opus
      when: [review]
      effort: high
    - id: fable
      provider: anthropic
      model: fable
      when: [architect, heavy]
      effort: high
