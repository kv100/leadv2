plan:
  steps:
    - id: 1
      agent: developer
      mission: >
        Normalize the epilogue path-in-scope scoper so LANE_WRITES rows with a
        trailing slash, /** or /* compare correctly against files the worker
        actually touched, fixing the defect that made 3 of this task's own 8
        original LANE_WRITES rows read as FOREIGN (out of scope) including its
        own report.md path; this is a prerequisite for every later step since
        no committed change in this task can land through the epilogue until
        the scoper recognizes its own write set.
      reads:
        - docs/handoff/WORKER-DOD-GATE-01/brief.md
        - plugins/leadv2/scripts/lib/leadv2-worker-epilogue.sh
      writes:
        - plugins/leadv2/scripts/lib/leadv2-worker-epilogue.sh
      acceptance: >
        Re-running the critic's dodtest-style probe against all 14 corrected
        LANE_WRITES rows (D2) returns IN_SCOPE for every one, including this
        task's own report.md path and its own epilogue edit — zero FOREIGN
        rows printed, pasted into report.md.
      tests:
        - "fixture case per trailing-slash / /** / /* variant, red before the fix, green after"

    - id: 2
      agent: developer
      mission: >
        Build the new lib/leadv2-dod-gate.sh library implementing checks
        (a) through (e) exactly per architect-v2 §4: hard checks a-d each
        return a named dod_fail reason line and can independently trigger
        rc=1, check (e) is report-only and never affects rc, check (c)
        resolves suite registration in-process from tests/run-all.sh's
        EXTRA_SUITE_MAP block with no shell-out, and every hard check reads
        an unreadable/missing input as rc=2 undetermined rather than a false
        pass or false fail.
      reads:
        - docs/handoff/WORKER-DOD-GATE-01/architect-v2.md#4-check-list
        - plugins/leadv2/scripts/leadv2-suite-falsifiable.sh
        - tests/run-all.sh
      writes:
        - plugins/leadv2/scripts/lib/leadv2-dod-gate.sh
      acceptance: >
        Against a fixture missing report.md with a brief that demands one,
        lv2_dod_gate_run returns rc=1 with dod_fail check=report_missing_or_unheaded;
        against the same fixture with a brief that never mentions report.md,
        check (a) returns dod_skip and overall rc=0 if no other check fires;
        against a fully-compliant fixture, rc=0; every invocation completes
        under 5 seconds, timed and printed in the suite's own output.
      tests:
        - "one red+green fixture pair per hard check (a)-(d)"
        - "one report-only assertion for check (e)"

    - id: 3
      agent: developer
      mission: >
        Rewrite leadv2-mutation-control.sh per architect-v2 §5: a
        baseline-green-first gate that refuses to proceed on a non-green
        baseline, a working-tree snapshot via git ls-files -co
        --exclude-standard plus tar (never git archive HEAD, which is
        committed-only and produces a lying-green result), a scratch tree
        given its own git identity via git init/add/commit so git-dependent
        suites run for a real reason, an exact-one anchor-match guard before
        applying the mutation, and an artifact file under
        <task_dir>/mutation-control/ carrying a diff_hash bound to the
        round's authoritative diff.
      reads:
        - docs/handoff/WORKER-DOD-GATE-01/architect-v2.md#5-leadv2-mutation-controlsh
        - plugins/leadv2/scripts/leadv2-suite-falsifiable.sh
      writes:
        - plugins/leadv2/scripts/leadv2-mutation-control.sh
      acceptance: >
        Run against a fixture suite with a deliberately red baseline (setup
        crashes) -> exit 2 control_not_applied reason=baseline_not_green;
        against a green-baseline suite with the anchor absent -> exit 2
        reason=anchor_count; against a green-baseline suite with a valid
        anchor and a mutation the suite's own assertions do not cover ->
        exit 1 mutant_survived; against a green-baseline suite with a valid
        anchor and a mutation the suite DOES cover -> exit 0 with a
        "MUTATION-CONTROL ok ... diff_hash=<hash>" line and the artifact file
        written; all four runs executed and pasted with their exit code and
        stdout; git -C ROOT status --porcelain is empty after every run.
      tests:
        - "the 4 exit-code cases above, each run and pasted, not asserted from memory"

    - id: 4
      agent: developer
      mission: >
        Wire the hard gate into leadv2-dispatch-product-close.sh as a new
        block inserted before the LEADV2_REVIEW_ENGINE branch check at line
        2756, so it runs unconditionally regardless of that flag's value —
        this is the direct fix for the CRITICAL finding that the gate was
        previously reachable only behind a flag whose production default is
        0. On rc=1 it writes review-gate.md with status fail and a
        dod_<check> reason and exits 7 before the review engine or reviewer
        pool is ever touched; on rc=2 it writes status blocked and exits with
        the new code 10, journaling review_dod_blocked rather than the
        existing review_roundcap cause.
      reads:
        - plugins/leadv2/scripts/leadv2-dispatch-product-close.sh
        - docs/handoff/WORKER-DOD-GATE-01/architect-v2.md#8-wiring--fileline
      writes:
        - plugins/leadv2/scripts/leadv2-dispatch-product-close.sh
      acceptance: >
        Running the lane's product-close path with LEADV2_REVIEW_ENGINE
        UNSET (the production default) against a fixture diff that violates
        check (d) shows review-gate.md written with status: fail and
        reason: dod_runtime_state_in_diff, the process exits 7, and grepping
        the run's own stderr shows zero resolve_review_pool_call or
        REVIEW_ENGINE log lines — the gate fired before the engine was ever
        invoked. Repeating with LEADV2_REVIEW_ENGINE=1 shows the identical
        refusal and exit 7.
      tests:
        - "refusal-path case, both LEADV2_REVIEW_ENGINE unset and =1"

    - id: 5
      agent: developer
      mission: >
        Add the defense-in-depth gate call to leadv2-review-run.sh as a
        single conditional-source line placed after the falsifiability
        gate's closing loop (~line 1318) and before the pool-resolve step
        (line 1319), mirroring the existing _REVIEW_REROUTE_NOTE_SH
        conditional-source idiom already in the file to keep this task's
        footprint in a file shared with REVIEW-SENTINELS-LANGUAGE-01 to the
        smallest possible diff; also add a new --task-dir argument to the
        script's own argument parser so the gate reads the correct handoff
        dir rather than assuming ${HANDOFF} equals the task dir.
      reads:
        - plugins/leadv2/scripts/leadv2-review-run.sh
        - docs/handoff/WORKER-DOD-GATE-01/architect-v2.md#8-wiring--fileline
      writes:
        - plugins/leadv2/scripts/leadv2-review-run.sh
      acceptance: >
        Invoking leadv2-review-run.sh directly (bypassing
        dispatch-product-close.sh) with --task-dir omitted against a
        DoD-violating fixture shows a dod_skip check=no_task_dir note and
        falls back to ${HANDOFF}-scoped checks only, never a crash or a
        silent pass; with --task-dir supplied, the full check set runs and
        status: fail reason: dod_<check> is written before any pool-resolve
        log line, and the process exits 7.
      tests:
        - "--task-dir omitted vs supplied, both against the same DoD-violating fixture"

    - id: 6
      agent: developer
      mission: >
        Add the shared lv2_dod_retry_or_finalize() function to
        lib/leadv2-worker-epilogue.sh implementing Option C's retry contract
