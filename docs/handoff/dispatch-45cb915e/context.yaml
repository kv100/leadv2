research:
  - source: architect-v2
    summary: "Post-REDESIGN revision resolving all 17 critic CHALLENGEs (§0 table); moves the hard gate to fire unconditionally in leadv2-dispatch-product-close.sh before the LEADV2_REVIEW_ENGINE branch, fixes the 3 broken LANE_WRITES rows, rewrites check (a)'s regex and check (b)'s evidence binding, rewrites the mutation-control snapshot to avoid lying-green, and adopts Option C for the in-worker retry."
