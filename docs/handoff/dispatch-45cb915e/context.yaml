task:
  id: WORKER-DOD-GATE-01
  class: Heavy
  mission: >
    Ship a deterministic bash definition-of-done gate that runs on a worker's
    committed lane BEFORE any model review, on the PRODUCTION review path (not
    only a flag-gated one), refuses the round on a missing mechanical DoD item
    (missing report.md, unanswered paste-line, ungrounded mutation-control
    claim, unregistered test suite, runtime-state path in the diff) at zero
    model spend, and gives the worker up to 2 in-session retries before the
    hard gate refuses the round.
  started_at: 2026-09-02T03:18:44Z

decisions:
  - id: D1
    topic: enforcement placement (CHALLENGE-01 CRITICAL)
    choice: >
      Single authoritative gate call (lv2_dod_gate_run) inserted directly into
      leadv2-dispatch-product-close.sh BEFORE the LEADV2_REVIEW_ENGINE branch
      splits (~line 2756), so it fires on both engine=0 (production default)
      and engine=1 paths from one call site; a second defense-in-depth call is
      added to leadv2-review-run.sh for direct/standalone invocations that
      bypass dispatch-product-close.sh entirely.
    rejected:
      - "v1: gate only reachable behind LEADV2_REVIEW_ENGINE=1 — inert in production since the flag's documented production default is 0"
    source: architect-v2
  - id: D2
    topic: LANE_WRITES scope + 3 broken rows (CHALLENGE-02 CRITICAL)
    choice: >
      Corrected 14-row LANE_WRITES list: lib/ path fixed (leadv2-worker-epilogue.sh
      lives under plugins/leadv2/scripts/lib/, not plugins/leadv2/scripts/),
      plugins/leadv2/prompts/** dropped entirely, trailing slash stripped from
      the handoff dir row, plus leadv2-dispatch-product-close.sh,
      leadv2-helpers.sh, leadv2-lane-outcome.sh and the 4 coder wrappers added.
      _lv2_epilogue_path_in_scope() normalized to strip trailing /, /**, /*
      before the case match (benefits sibling briefs too).
    rejected:
      - "brief's original 8-row list — 3 of 8 rows failed the live scoper, including this task's own report.md path under docs/handoff/WORKER-DOD-GATE-01/"
    source: architect-v2
  - id: D3
    topic: task-dir resolution for checks (a)/(b)/(e) (CHALLENGE-03 CRITICAL)
    choice: >
      dispatch-product-close.sh computes TASK_DIR="${ROOT}/docs/handoff/${FOUNDER_TASK_ID}"
      directly at the new pre-branch call site (FOUNDER_TASK_ID is already a
      positional param at that script's line 23). leadv2-review-run.sh gets a
      NEW --task-dir arg for its own call; when omitted it falls back to
      ${HANDOFF}-scoped checks with an explicit dod_skip note, never a silent
      assumption that ${HANDOFF} equals the task dir.
    rejected:
      - "reading ${HANDOFF} directly — resolves to docs/handoff/dispatch-<sig8>, not the task's own handoff dir; every hard check would read the wrong files"
    source: architect-v2
  - id: D4
    topic: check (a) report-heading regex calibration (CHALLENGE-04 CRITICAL)
    choice: >
      Regex rewritten to ^#{2,3}[[:space:]].*[Ee]vidence (case-insensitive,
      non-anchored); check is conditional on brief.md mentioning "report.md" —
      skipped (dod_skip), not failed, when the brief never asked for one.
      Calibrated against the 37-report corpus, target 0 false refusals.
    rejected:
      - "v1's original heading regex — refused 37 of 37 real reports in the corpus; uncalibrated against any real sample"
    source: architect-v2
  - id: D5
    topic: mutation-control scratch-tree snapshot mechanism (CHALLENGE-05 CRITICAL)
    choice: >
      Baseline-green-first gate (non-green baseline -> exit 2
      control_not_applied reason=baseline_not_green, never ok); snapshot the
      WORKING tree via `git ls-files -co --exclude-standard` + tar, not
      `git archive HEAD`; scratch tree gets `git init -q && git add -A &&
      git commit -qm base` for a real git identity (never `git worktree add`).
    rejected:
      - "git archive HEAD | tar -x — committed-only, misses uncommitted suite/mutation-target files the worker is still iterating on; produces a lying-green result by construction"
    source: architect-v2
  - id: D6
    topic: check (c) suite-registration mechanism (CHALLENGE-06 HIGH, CHALLENGE-08 HIGH)
    choice: >
      Resolved IN-PROCESS inside lib/leadv2-dod-gate.sh by reading
      EXTRA_SUITE_MAP + the stem convention directly from tests/run-all.sh's
      text — no shell-out, no state write. tests/run-all.sh absent in the
      target repo -> dod_skip check=suite_registration reason=no_run_all.
    rejected:
      - "tests/run-all.sh --scope changed --dry-run (brief's literal ask) — stateful; the state write precedes the execution loop and poisons the very selection being checked"
      - "--dry-run flag does not exist in every adopted repo (0 hits in persona-engine's tests/run-all.sh) — not portable"
    source: architect-v2
  - id: D7
    topic: check (b) mutation-control evidence binding (CHALLENGE-07 HIGH)
    choice: >
      The mutation-lines sub-check requires an ARTIFACT file
      ${TASK_DIR}/mutation-control/<run-id>.txt whose diff_hash field equals
      sha256(DIFF_FILE) for the round — reusing leadv2-review-run.sh's
      _review_diff_hash() pattern verbatim.
    rejected:
      - "prose grep for a MUTATION-CONTROL sentinel string in report.md — gameable by report text alone, same failure shape as checks (a) and (e)"
    source: architect-v2
  - id: D8
    topic: check (e) external-claims severity (CHALLENGE-14 MEDIUM)
    choice: >
      Check (e) is report-only: writes dod_note lines to dod-gate.md and NEVER
      contributes to lv2_dod_gate_run's exit code.
    rejected:
      - "check (e) as a blocking hard check — critic measured ~19% false-refusal rate on the 37-report corpus and it duplicates a rule the reviewer model already enforces"
    source: architect-v2
  - id: D9
    topic: soft-tier reader (CHALLENGE-09 HIGH)
    choice: >
      leadv2-lane-outcome.sh extended to read worker_dod= from
      progress.log/meta.yaml and append dod=fail:<checks> to its own status
      line output, named as the soft tier's reader.
    rejected:
      - "writing worker_dod= with no reader anywhere in the codebase — a control nobody consumes is equivalent to not writing it"
    source: architect-v2
  - id: D10
    topic: in-worker retry mechanism, brief item 3 (CHALLENGE-10 HIGH)
    choice: >
      Option C adopted explicitly, not deferred: shared
      lv2_dod_retry_or_finalize() added to lib/leadv2-worker-epilogue.sh
      (already shared by all 4 coder wrappers); each wrapper implements an
      <=8-line retry_hook_fn feeding the gate's failure text into its OWN
      existing inner turn-loop as the next worker turn — no recursive
      --resume-lane dispatch.
    rejected:
      - "Option A (soft-signal only) — silently drops brief item 3's in-worker retry while being described as full delivery; an undisclosed descope"
      - "Option B (recursive --resume-lane re-entry) — carries re-entrancy risk R5, rejected by the architect's own design"
    source: architect-v2
  - id: D11
    topic: per-wrapper retry-hook re-enterability, new risk R9
    choice: >
      Wire retry_hook_fn into all 4 wrappers per D10; a wrapper whose inner
      turn-loop is confirmed NOT re-enterable mid-flight degrades that
      wrapper's hook to a no-op (soft signal only, same as today) — never a
      crash, never a silent skip of the [2a] hard gate (which is independent
      of this mechanism). Implementer MUST verify re-enterability per-wrapper
      in plan step 6 before wiring; this was not verified during design
      (out of architect-v2's discovery budget) and is carried forward as an
      OPEN item, not resolved by this synthesis.
    rejected:
      - "assuming all 4 wrappers are re-enterable without per-wrapper verification — architect-v2 explicitly flags this as unverified (R9, HIGH)"
    source: architect-v2
  - id: D12
    topic: checks (c)/(d) diff source (CHALLENGE-12 MEDIUM)
    choice: >
      Both checks read DIFF_FILE exclusively — the round's authoritative diff,
      already resolved upstream by the caller as ${diff_file}. Standalone
      invocation with no diff file -> dod_skip, never a fallback to
      `git diff main HEAD`.
    rejected:
      - "git diff main HEAD (brief's literal ask) — main is not reliably the round's base ref; review-run.sh's falsifiability gate already resolves DIFF_FILE upstream and reads it exclusively"
    source: architect-v2
  - id: D13
    topic: ledger cause for DoD-undetermined (CHALLENGE-13 MEDIUM)
    choice: >
      NEW exit code 10, reserved exclusively for DoD-undetermined
      (rc=2/undetermined from the gate) -> _dl_note dead review_dod_blocked.
      Exit 8 (review_roundcap) and exit 7 (review_verdict_fail, used for DoD
      hard-fail) are both left untouched.
    rejected:
      - "reusing exit 8 for the DoD-undetermined case — mislabels the ledger cause as review_roundcap, a pre-existing and semantically different failure mode"
    source: architect-v2
  - id: D14
    topic: sibling write-set collisions (CHALLENGE-11 HIGH)
    choice: >
      leadv2-review-run.sh's edit reduced to a single source-guarded
      conditional line (mirrors the existing _REVIEW_REROUTE_NOTE_SH idiom in
      the same file). plugins/leadv2/prompts/** dropped entirely from this
      task's writes (removes that collision with REVIEW-SENTINELS-LANGUAGE-01
      outright). Four files remain CONTESTED — shared with a sibling lane's
      LANE_WRITES and named explicitly here rather than silently assumed
      collision-free: leadv2-review-run.sh (REVIEW-SENTINELS-LANGUAGE-01),
      tests/run-all.sh (all 3 siblings), lib/leadv2-worker-epilogue.sh
      (LAND-PATH-IS-BROKEN-01), plugins/leadv2/scripts/tests/ directory
      (TESTS-POLLUTE-REAL-JOURNAL-01 — this task only adds
      test-worker-dod-gate.sh, never touches another file in that dir). The
      dod_* reason enum (dod_report_missing_or_unheaded,
      dod_paste_evidence_missing, dod_mutation_control_not_via_runner,
      dod_suite_unregistered, dod_runtime_state_in_diff, dod_skip/dod_note) is
      requested via report.md as a registration handshake with
      REVIEW-SENTINELS-LANGUAGE-01's parser — never assumed compliant without
      that lane's own confirmation. Brief's "Merge main FIRST" rule is the
      serialization discipline for all 4 contested files; the lead must
      serialize commits touching them across lanes, not assume parallel-safe.
    rejected:
      - "v1's unstated collision on 3+ paths across 3 sibling lanes with no named serialization discipline"
    source: architect-v2
  - id: D15
    topic: worker-facing contract text wiring, prompts/** unverified (CHALLENGE-17 LOW-but-load-bearing)
    choice: >
      New readonly string _LEADV2_DOD_GATE_CONTRACT_MISSION added to
      plugins/leadv2/scripts/leadv2-helpers.sh, adjacent to the proven
      _LEADV2_EVIDENCE_CONTRACT_MISSION (lines 62-66) — same pattern, same
      file, consumed by whichever caller already concatenates the
      evidence-contract string into worker mission text.
    rejected:
      - "plugins/leadv2/prompts/** fragment with no confirmed mechanism reaching a live worker system prompt — brief item 2 (workers told to use leadv2-mutation-control.sh instead of hand-editing) depends on this reaching workers; critic's finding: 'that is not a MEDIUM implementation detail; it decides whether the cause-row-2 fix functions at all'"
    source: critic
  - decision: capability-search
    considered:
      - "leadv2-suite-falsifiable.sh exit-code convention (0/1/2/3) + mktemp -d/trap idiom + rc=2 'undetermined, never a pass' doctrine"
      - "_review_diff_hash() sha256(DIFF_FILE) pattern in leadv2-review-run.sh:592-599"
      - "falsifiability-gate shape: refuse-before-pool-resolve, status: fail/reason:, exit 7/8, DIFF_FILE-only sourcing (leadv2-review-run.sh:1264-1318)"
      - "_lv2_epilogue_path_in_scope() quoted-case scoper (lib/leadv2-worker-epilogue.sh:48-57)"
      - "leadv2_worker_commit_epilogue() shared call site across all 4 coder wrappers"
      - "_REVIEW_REROUTE_NOTE_SH conditional-source idiom in leadv2-dispatch-product-close.sh"
      - "_LEADV2_EVIDENCE_CONTRACT_MISSION readonly-string pattern in leadv2-helpers.sh:62-66"
      - "EXTRA_SUITE_MAP='<stem>:<suite>' block format in tests/run-all.sh:100-105"
      - "founder lesson (2026-08-22): never git worktree add/prune for scratch state"
    chosen: >
      Reuse all 9 existing primitives verbatim or adapted (architect-v2 §3
      capability census). Only 3 new files are created:
      plugins/leadv2/scripts/lib/leadv2-dod-gate.sh,
      plugins/leadv2/scripts/leadv2-mutation-control.sh, and
      plugins/leadv2/scripts/tests/test-worker-dod-gate.sh — no new custom
      mechanism was built where an existing primitive already covered the
      need.
    why: >
      architect-v2 ran an explicit capability census (§3) before designing
      each check and the mutation-control tool, citing file:line for every
      reused primitive. Codex was unavailable for this task's triad — this
      handoff dir contains only architect(v1->v2 redesign) and critic
      deliverables, no codex.md; the capability-search check therefore ran
      against the architect's own census plus critic's cross-check, not a
      third independent pass.
    source: architect-v2

