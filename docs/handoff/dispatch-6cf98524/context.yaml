# LANE-WRITESET-REGISTRY-01 — architect design (PLANNING ONLY, no code edits)
# Canonical repo: /Users/kostiantyn.vlasenko/Projects/leadv2
# All paths below are relative to that root unless absolute.

task_id: LANE-WRITESET-REGISTRY-01
class: Heavy

# ─────────────────────────────────────────────────────────────────────────────
# HEADLINE FINDING (changes the shape of the task)
# ─────────────────────────────────────────────────────────────────────────────
# This is NOT a build task. The write-set registry already exists end-to-end and
# is DEAD ON THE LIVE PATH — a textbook PULSE-IN-SINGLE-LEAD-01 recurrence:
#
#   * plugins/leadv2/scripts/leadv2-active-registry.sh:410-419  — `set_writes` op
#     persists a lane's declared writes CSV onto its active.yaml row, under the
#     existing python flock. Shell wrapper `leadv2_active_set_writes` at :742-749.
#   * plugins/leadv2/scripts/leadv2-writes-overlap.sh — a complete detector that
#     compares a NEW lane's writes against every ALIVE lane's `writes` in
#     active.yaml (prefix-overlap semantics, :86-89 `overlaps()`), emits
#     `task=<tid> other=<tid> paths=<csv>`.
#   * plugins/leadv2/scripts/tests/test-writes-overlap.sh — a passing 5-case suite.
#
# Its ONLY callers are leadv2-fanout.sh:1535 and :1845 — the RETIRED supervisor
# arm (leadv2.md:124, SUPERVISOR-DELETE-01). `grep -rn set_writes` finds ZERO
# calls from leadv2-dispatch-code.sh. So on the single-lead live path every lane
# row is written with NO `writes` key and the detector is never invoked.
#
# Meanwhile leadv2-dispatch-code.sh ALREADY HAS the declared write set in hand:
# `--writes` is an accepted flag, `REQUIRE_LANE_WRITES=1` (:639) makes it
# fail-closed via `_lane_writes_guard` (:3414-3446), the architect prepass
# harvests a `LANE_WRITES:` line (:3318-3333), and the review gate already scopes
# `git diff <start-sha> -- <lane_writes>` with it (:704). The value exists, is
# mandatory, and is already load-bearing — it simply never reaches active.yaml.
#
# Therefore: this task is THREE WIRES plus one atomicity fix, not a new subsystem.

decisions:

  - id: D1
    decision: >-
      Reuse the EXISTING `writes` key on the active.yaml lane record. Do NOT add a
      new `write_set:` key. The reader accepts `write_set` as an alias (union) for
      forward tolerance, but the writer only ever writes `writes`.
    overturns: "the mission's literal `write_set:` field name"
    rationale: >-
      leadv2-writes-overlap.sh:124 already keys on `other.get("writes")` and
      leadv2-active-registry.sh:416 already writes `target["writes"]`, both shipped
      and both under flock. Adding `write_set` forks the schema into two sources of
      truth for one fact. The concrete failure that buys us: a lane registered by
      an older writer (or by fanout, still on disk in all three repos) populates
      `writes`, while a new reader looks at `write_set`, finds nothing, and reports
      NO CONFLICT. That is a silent false-negative in exactly the gate we are
      building — the lying-green disease, shipped on day one. Renaming is pure cost
      with a negative safety delta.

  - id: D2
    decision: >-
      SOURCE = declared at dispatch. Confirmed, with no new input channel: the value
      is the `writes` CSV that leadv2-dispatch-code.sh already resolves (explicit
      `--writes`, else the architect prepass `LANE_WRITES:` line), at the point
      where `_lane_writes_guard` has just proven it non-empty.
    rejected_alternatives:
      - option: derive from the plan (docs/tasks.yaml files_hint)
        why_rejected: >-
          leadv2-collision-check.sh --compare-tasks already does exactly this and
          demonstrates the flaw — it WARNs and exits 0 whenever files_hint is absent
          ("WARN: files_hint absent"), and files_hint is a planning hint that is
          NOT the review-scoping source. Deriving here creates a second write set
          that can legally disagree with the one the review gate diffs against, so a
          lane could be admitted on set A and reviewed on set B.
      - option: observe from the lane's first git diff
        why_rejected: >-
          Structurally too late. Admission must decide BEFORE the worker is spawned;
          by the time a first diff exists both lanes have already written the same
          file and the corruption we exist to prevent has happened. Observation is
          still valuable — it is exactly what D5 uses at commit — but as a drift
          detector, never as the admission input.

  - id: D3
    decision: >-
      ENFORCEMENT POINT (a) — admission — is CONFIRMED, but it must live INSIDE the
      registry's `register` op, in the same locked python block, NOT as a shell-level
      check-then-register in leadv2-dispatch-code.sh. Extend `register` to take a
      `writes` argument; it intersects against alive rows and refuses with a distinct
      exit code, atomically with the append.
    overturns: "the implicit 'check, then dispatch' reading of the working assumption"
    rationale: >-
      A shell-level `writes-overlap.sh && register` is a TOCTOU race, and
      CONCURRENCY-2-LANES-01 (2 lanes/session, unlimited sessions) makes it reachable
      rather than theoretical: two leads in different sessions both read active.yaml,
      both see no conflict, both register, both spawn on the same file. The flock only
      protects each individual write, not the check-then-act pair. Folding
      intersect+append into one op reuses the flock that leadv2-active-registry.sh
      already holds and closes the window by construction. It also eliminates the
      second window in today's fanout pattern, where `register` and `set_writes` are
      two separate locked calls and the row is alive-with-no-writes in between —
      during which a peer's check legitimately sees an empty set and admits.

  - id: D4
    decision: >-
      The BLOCK decision does not go inside leadv2-writes-overlap.sh. That script
      stays fail-open, notify-only, and byte-compatible for its fanout callers; it
      is retained for the close-time notify (D8) and for the human-readable conflict
      line. Policy lives in the registry op (D3) and in dispatch-code's rc mapping.
    rationale: >-
      Two reasons, one of them CRITICAL. (1) Contract: that script's header states
      it "must never be why a dispatch fails or hangs" and all three consuming repos
      may still reach it through fanout; changing its return semantics is a breaking
      change to a shared plugin. (2) CRITICAL config contradiction —
      LEADV2_WRITES_CONFLICT_NOTIFY=0 makes that script a total no-op at :41
      (exit 0, no stdout, no side effects). If the new BLOCK read that script's
      stdout, then a legacy notify-suppression flag would silently disable a safety
      gate, and the gate would report clean. A safety gate may never be switchable
      by a flag whose documented meaning is "quieter notifications". The registry
      op has no such flag and is the correct home.
    self_check_source: architect(self-check item 5)

  - id: D5
    decision: >-
      ENFORCEMENT POINT (b) — commit-time drift — is CONFIRMED. `git diff --name-only`
      is compared against the declared set at the existing review-scoping point.
      On drift the action is WARN + WIDEN + JOURNAL, never a commit block — with ONE
      escalation to BLOCK, defined in D6.
    rationale: >-
      Blocking at commit is the wrong lever three ways. (i) The work is already
      written; refusing the commit strands a finished diff in a worktree with no
      landing path and no rollback, which our own history ranks as the worse failure
      (worktree loss). (ii) The real harm of drift is not the extra file, it is that
      the file is INVISIBLE TO REVIEW — leadv2-dispatch-code.sh:704 scopes the review
      diff by the declared set, so an undeclared file lands unreviewed. The correct
      remedy is therefore to widen the review scope to the union of declared+actual,
      which converts a silent hole into a reviewed change. (iii) A declaration that
      was merely too narrow is a planning miss, not a correctness violation, and
      punishing it with lost work trains lanes to over-declare — which would make the
      admission intersection in D3 fire constantly and force us to turn it off.
      Net: drift is non-fatal to the LANE, fatal to a SILENT file.

  - id: D6
    decision: >-
      Drift escalates from WARN to BLOCK in exactly one case: a drifted path
      intersects ANOTHER currently-alive lane's declared set. That commit is refused
      and the lane is PARKed for lead adjudication.
    rationale: >-
      That case is not a planning miss — it is the precise corruption the feature
      exists to prevent, observed after the fact: two live lanes have now written the
      same file. Landing it would merge one lane's edit over another's in-flight work.
      This keeps the blocking surface as small as it can be while still being real.

  - id: D7
    decision: >-
      BACKWARD COMPATIBILITY — an incumbent alive row with NO `writes` key is a THIRD
      state, `unknown`. It is neither "conflicts with everything" nor "conflicts with
      nothing". Under LEADV2_WRITESET_ENFORCE=block an unknown incumbent REFUSES the
      dispatch with its own distinct exit code (rc=6, writeset_unknown), separate
      from a real intersection (rc=5, writeset_conflict); under the default
      `warn` it admits but emits `LEADV2_WRITESET_UNKNOWN other=<tid>` to stdout and a
      journal finding. It is never silent in either mode, and the count of unknown
      rows is a measurable number.
    rationale: >-
      "Conflicts with everything" is unshippable: on rollout day EVERY alive row is
      legacy, so the first dispatch after the upgrade blocks on all of them — a
      guaranteed false-block storm across three repos. "Conflicts with nothing" is the
      lying-green disease: the gate reports clean precisely when it has no data, which
      is the one situation where it should be loudest. The third state satisfies the
      non-negotiable literally — absent never silently means either — and it drains on
      its own, because D3 makes every NEW row carry `writes` at register time. The two
      distinct exit codes matter for telemetry: they let us watch `unknown` go to zero
      before flipping the default to `block`, instead of guessing.
    rollout: >-
      LEADV2_WRITESET_ENFORCE defaults to `warn` for one soak window, then `block`.
      The flip is a one-line default change and is the single-flip rollback. Log a
      row in the consuming repo's scheduled-decisions ledger with the GO-condition
      "zero rows emit LEADV2_WRITESET_UNKNOWN across a full working day".

  - id: D8
    decision: >-
      PARTS 2 AND 3 CANNOT BE DONE IN SHELL. ListAgents and SendMessage are HARNESS
      tools available to a Claude session, not commands available to a bash script —
      `grep -rn ListAgents plugins/leadv2/scripts/` returns ZERO hits; the only
      references in the repo are prose in plugins/leadv2/commands/leadv2.md:100.
      Design accordingly: the shell renders and persists, the LEAD relays.
      `/leadv2 sessions` = registry table (shell) merged with an optional
      `--peers-json <file>` that the lead writes from its own ListAgents call.
      Close-time notify = the close script writes durable notify intents to disk and
      to each peer's journal; the lead relays them via SendMessage best-effort.
    rationale: >-
      A plan that told a bash script to "call ListAgents" would be unimplementable and
      would be discovered only by the implementing agent. Splitting at the real
      process boundary also gives the better failure mode for free: the on-disk half
      always succeeds, so the feature degrades to "correct but unannounced" rather
      than "lost", which is what makes the non-fatal-notify non-negotiable satisfiable.

  - id: D9
    decision: >-
      Env var naming: LEADV2_WRITESET_ENFORCE (values warn|block). Confirmed against
      the repo's LEADV2_* convention — siblings LEADV2_REQUIRE_LANE_WRITES:639,
      LEADV2_WRITES_CONFLICT_NOTIFY (writes-overlap.sh:41), LEADV2_DISPATCH_SPAWN.
      No LEAD_V2_* drift. No `claude -p` invocation is introduced by this plan, so
      the --max-turns / --permission-mode / --output-format check is N/A.
    self_check_source: architect(self-check items 1 and 3)

off_limits:
  - plugins/leadv2/scripts/leadv2-fanout.sh          # retired supervisor arm; do not revive, do not "fix"
  - plugins/leadv2/scripts/leadv2-supervise-loop.sh  # retired
  - plugins/leadv2/scripts/leadv2-writes-overlap.sh  # detector semantics FROZEN (D4); read-only in this task
  - "any path under a CONSUMING repo (persona-engine/, m3-market/, respiro-ios/)"  # symlinks to canonical; editing through them is the 2026-07-29 defect
  - plugins/leadv2/scripts/tests/test-writes-overlap.sh  # existing 5 cases are the fanout regression baseline; APPEND only, never rewrite
  - docs/leadv2/active.yaml                          # live registry state; never hand-edit, only through the flocked ops

