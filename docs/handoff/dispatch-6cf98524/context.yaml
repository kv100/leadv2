  negative_control:
    statement: >-
      Declared mutation, applied INSIDE the function body (never at top level — a
      top-level insert reddens every suite for the wrong reason and reads as a pass).
    mutation: >-
      In leadv2-active-registry.sh, inside the `register` op's intersect loop added by
      step 2, change the overlap predicate to `if False:` (i.e. never detect an
      intersection) while leaving the arg, the persisted `writes` key, and the exit
