risk: >-
  The dominant risk is FALSE BLOCKS, and it has three distinct sources that must not be
  conflated. First, over-declaration: `writes` is already the review-scoping input, and
  lanes have every incentive to declare a wide directory prefix to keep review honest;
  because the overlap rule is prefix-based (leadv2-writes-overlap.sh:86-89), two lanes
  that both declare plugins/leadv2/scripts/ intersect even when they touch disjoint
  files — under CONCURRENCY-2-LANES-01 with two lanes per session across unlimited
  sessions in a repo whose real work concentrates in one directory, this could refuse
  most second dispatches. That is precisely why D7 defaults LEADV2_WRITESET_ENFORCE to
  warn: the soak measures the real false-block rate before anything is refused, and
  the flip to block is one line with a one-line rollback. Second, the legacy-row
  storm: every row alive at upgrade time lacks `writes`, so a naive "absent conflicts
  with everything" would refuse everything on day one across three repos — D7's third
  `unknown` state exists solely to make that impossible while still refusing to lie
  clean. Third, and most dangerous because it fails in the safe-looking direction: if
  enforcement had been built on leadv2-writes-overlap.sh's stdout, then the pre-existing
  LEADV2_WRITES_CONFLICT_NOTIFY=0 kill-switch would silently disable the safety gate and
  the gate would report no conflicts — D4 moves the decision into the registry op
  specifically so no notify-suppression flag can turn a gate green. Beyond false blocks,
  the schema risk is a lane registered by an OLDER writer in another repo: the register
  op gains a positional arg, so the wrapper must default it and every existing caller
  (fanout included, which we do not touch) must keep working unchanged — a wrapper arity
  mismatch would break dispatch in all three repos at once, which is why step 1 is
  deliberately additive-with-default rather than a signature change. Finally, the
  concurrency surface itself: active.yaml is read+written by two parallel lanes, and the
  ONLY reason this design is safe is that the intersect and the append happen inside one
  flock acquisition (D3); any implementation that reverts to check-in-shell-then-register
  silently reintroduces the TOCTOU race and the gate becomes decorative under exactly the
  concurrency it was built for.

verification:
  live_signal: |
    # Proves a REAL intersecting dispatch is REFUSED (not merely warned), end to end,
    # in a sandbox that never touches the repo's own docs/leadv2/active.yaml.
    # UNVERIFIED (design-time; not executed — this task is planning only). The
    # implementer must run this and paste the output as the close evidence.
    set -e
    T="$(mktemp -d)"; mkdir -p "$T/docs/leadv2"
    cd /Users/kostiantyn.vlasenko/Projects/leadv2/plugins/leadv2/scripts
    export LEADV2_PROJECT_ROOT="$T" LEADV2_STATE_ROOT="$T" CLAUDE_PROJECT_DIR="$T"
    export LEADV2_WRITESET_ENFORCE=block LEADV2_DISPATCH_SPAWN=0
    source ./leadv2-active-registry.sh
    # incumbent lane, alive (own PID), declares the contested path
    leadv2_active_register "sess-A" "LANE-A" "$T" "wt-A" "$(date -u +%FT%TZ)" \
      exec Standard "$$" "-" "" 0 "$(date -u +%FT%TZ)" "$T/a.log" "-" "-" \
      "plugins/leadv2/scripts/leadv2-dispatch-code.sh"
    # candidate lane declares an intersecting path -> MUST refuse with rc=5
    set +e
    out="$(leadv2_active_register "sess-B" "LANE-B" "$T" "wt-B" "$(date -u +%FT%TZ)" \
      exec Standard "$$" "-" "" 0 "$(date -u +%FT%TZ)" "$T/b.log" "-" "-" \
      "plugins/leadv2/scripts/leadv2-dispatch-code.sh" 2>&1)"; rc=$?
    set -e
    printf 'rc=%s\n%s\n' "$rc" "$out"
    # PASS iff ALL THREE hold:
    test "$rc" = "5"
    printf '%s' "$out" | grep -q 'writeset conflict: other=LANE-A'
    # and LANE-B must NOT have been appended (atomicity of intersect+append):
    ! grep -q 'task_id: LANE-B' "$T/docs/leadv2/active.yaml"
    echo "LIVE_SIGNAL_PASS"
  secondary_signal: |
    # Proves the DISPATCH layer surfaces the refusal with the existing marker
    # convention (parsed at leadv2-dispatch-code.sh:4550), not a bare non-zero exit.
    # Expect on stdout: "LEADV2_DISPATCH_REFUSED: writeset_conflict"
    LEADV2_DISPATCH_SPAWN=0 LEADV2_WRITESET_ENFORCE=block \
      bash ./leadv2-dispatch-code.sh resolve --mission "edit dispatch-code" \
      --writes "plugins/leadv2/scripts/leadv2-dispatch-code.sh" 2>&1 \
      | grep -c 'LEADV2_DISPATCH_REFUSED: writeset_conflict'

