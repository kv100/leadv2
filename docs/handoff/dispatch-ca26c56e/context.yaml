task_id: dispatch-ca26c56e
title: CLAUDE-PROFILE-DEFAULT-TOKEN-EXPIRED-01 — fix default_token_expired false alarm
decisions:
  - D1: Verdict is FALSE ALARM for the warn as currently worded — two independent, confirmed-live
      defects cause it: (A) selector falls back to a stale legacy keychain service
      "Claude Code-credentials" instead of the live per-config-dir suffixed service
      "Claude Code-credentials-<sha256(config_dir)[:8]>"; (B) selector judges liveness off
      claudeAiOauth.expiresAt (access-token expiry, ~8h rolling, legitimately often in the past)
      instead of refreshToken/refreshTokenExpiresAt (~3wk horizon, the real liveness signal).
  - D2: Fix direction is (a) check refreshability + correct service resolution. Do NOT silence or
      demote the warn (option b) — that hides Defect A and leaves the registry-loop availability bug
      at credential_health() call site (currently inline :245-253) refusing all selection nightly.
  - D3: Rename the warn string default_token_expired -> default_token_unrefreshable (and
      token_expired -> token_unrefreshable in the registry loop). Old strings must not still match,
      by design — 207 historical lines trained everyone to ignore them.
  - D4: No new env vars introduced by this task.
  - D5: The stdout contract token `reason=all_expired` (consumed by claude-subsession.sh:480's
      regex) stays byte-identical. Do not rename it; that is a caller-side change and out of scope.
  - D6: Negative control mutation MUST be inserted inside credential_health()'s function body
      (between its opening and closing brace), never at file top level. A top-level insert makes
      every suite fail for the wrong reason and would read as a false pass.
  - D7: Never print or log a credential value, access token, or refresh token, anywhere (stdout,
      stderr, journal, test fixtures beyond the fixed `sk-ant-r` test doubles already in use).
  - D8: Hash the config-dir -> suffixed-service-name derivation via python3 (already a hard
      dependency of derive_identity) — no shasum/sha256sum, no new dependency, bash-3.2 safe.
