task_id: dispatch-eb7431bc
lane: D4-NO-PATH-LOSES-WORK-01
title: "No path loses work — external orphan-checkpoint sweeper"

decisions:
  - D1: "Mechanism = external periodic sweeper (leadv2-orphan-checkpoint.sh), not an in-process trap. Trap is optional 2nd-commit backstop only, never the guarantee."
  - D2: "Liveness authority = process cwd inside worktree path (lsof -a -d cwd -Fpn global pass, prefix-match), NOT mtime, NOT bare pgrep on lane name. Fail-closed to ALIVE if lsof missing/errors."
  - D3: "When a PID handle is already recorded (dispatcher's handle=PID=...), use kill -0 on it directly — do not re-derive liveness from argv patterns for that case."
  - D4: "A lane with multiple recorded handles is ALIVE if ANY pid is alive; DEAD only if ALL are dead."
  - D5: "Never a bare unquoted \$pids loop (zsh word-split trap) — iterate via array or while-read <<<. Suite must run under both bash and zsh and fail if they disagree."
  - D6: "Commit message token for the new sweeper is '(ORPHAN)', distinct from pc_stop_gate_autocommit's '(STOP-GATE)', so leadv2-dispatch-code.sh:3175's exact-string grep and lane-liveness L11 'landed' heuristic stay unaffected."
  - D7: "Reuse lib/leadv2-mission-writeset.sh for scope resolution and copy pc_stop_gate_autocommit's temp-index (GIT_INDEX_FILE / read-tree HEAD / add / diff --cached --quiet) discipline verbatim from leadv2-dispatch-product-close.sh:1990-2020. Do not reinvent or rewrite that logic's semantics."
  - D8: "Out-of-scope dirty paths (not in LANE_WRITES) go to a distinct 'orphan-quarantine/<lane>' branch, journaled, never merged into the lane's own branch history."
  - D9: "Checkpoint-then-sweep ordering is load-bearing: the checkpointer must run BEFORE leadv2-merged-worktree-sweep.sh's sweep logic and before leadv2-phase8-close.sh:654's sweep block (b413968c discard-then-remove incident)."
  - D10: "Negative control mutation must be INSIDE the body of lv2_orphan_checkpoint_lane(), never at file top level: (1) --untracked-files=all -> --untracked-files=no must turn A1/A2 RED; (2) optional: deleting the diff --cached --quiet guard must turn A4 RED."
  - D11: "EXTRA_SUITE_MAP rows are APPEND-ONLY at the end of the existing block in tests/run-all.sh (~line 134+). Never reorder existing rows."
  - D12: "--dry-run and LEADV2_ORPHAN_CHECKPOINT=0 must both produce a one-flag rollback (no commits made)."

