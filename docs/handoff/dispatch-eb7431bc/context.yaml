acceptance: |
  A1 SIGKILL worker -> checkpoint commits dirty tracked+untracked files, no manual git command.
  A2 whole process-group killed -> same assertion (the 7-lane case).
  A3 idempotent -> exactly ONE (ORPHAN) commit across 2 runs, 2nd run exits 0 skipped_clean.
  A4 clean lane -> rev-parse HEAD unchanged, no empty commit.
  A5 live worker (cwd inside worktree) -> skipped_alive, nothing committed.
  A6 out-of-scope dirty file -> lands on orphan-quarantine/<lane>, NOT lane branch.
  Plus: false-zero, false-life, mirror-dead, several-handles-one-alive liveness cases named individually.
  Plus: negative control RED (mutation) then GREEN (revert) with pasted exit codes, bash AND zsh.
  Plus: tests/run-all.sh --scope changed output showing the new suite selected via all 5 EXTRA_SUITE_MAP rows.
