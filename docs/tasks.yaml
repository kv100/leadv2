    note: 'GATE-PROVES-ITS-OWN-CONTROL-01: the review gate must apply the declared
      mutation itself and require red, instead of trusting the author''s prose. Four
      requirements: suite exits non-zero (a FAIL: line with $?=0 is not red); THAT
      suite alone goes red (a mutation also killed by mypy/a linter/another suite
      proves nothing); revert restores green with the production file byte-identical;
      the cycle leaves the repo byte-identical. Otherwise blocked: control_not_diagnostic,
      never pass. Plus: product mutations counted separately from detector self-tests,
      headline carries only the product number; and acceptance asserts killed == scored
      == len(catalog) rather than a pinned literal. Evidence: three fake shapes landed
      today alone — test-arm-admission 16/0 stayed 16/0 with the hardcoded --base-arm
      restored at dispatch-code.sh:1920; test-codex-broker-staleness 3/0 stayed 3/0
      with the -d sessionDir test dropped; and the V5 track''s l4 law is killed by
      mypy before pytest so its suite can be deleted whole without moving the number.'
  notes: null
