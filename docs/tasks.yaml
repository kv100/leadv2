    note: 'DIAGNOSTIC-WORKTREE-BECOMES-A-LANE-01: черновой worktree, созданный диагностическим
      агентом, статусная поверхность считает живой линией и назначает активной задачей
      лида. Наблюдено 2026-09-02: агент, воспроизводивший фазовый дедлок вживую, создал
      worktree PHASE-PATH-REPRO-01 и оставил его; в реестре ~/.claude/leadv2-state/leadv2/active.yaml
      его 0 упоминаний, в журнале диспатчей 0, коммитов сверх main ровно один и тот
      якорный, дерево чистое, процессов ноль. Тем не менее анти-молчальный пульс напечатал
      «live=0: PHASE-PATH-REPRO-01=нет-журнала; PHASE-PATH-REPRO-01=нет-журнала» (дважды
      одну строку), status-snapshot.json подхватил его, а UserPromptSubmit-хук выдал
      лиду «ACTIVE TASK: PHASE-PATH-REPRO-01 | phase: spawning» вместе с полным ORCHESTRATOR_ROLE-блоком.
      То есть личность активной задачи лида была переписана черновиком чужого агента.
      Причина та же, что в PLUGIN-VERDICT-01: у состояния линий нет владельца, поэтому
      каталог worktrees сам по себе служит источником правды наравне с реестром, и
      они расходятся. Нужно: (1) линией считается только то, что есть в реестре —
      каталог worktrees не источник правды; (2) worktree без строки в реестре обязан
      называться осиротевшим и предлагаться к уборке, а не выдаваться за активную
      задачу; (3) диагностические прогоны создают worktree в mktemp, а не в .claude/worktrees;
      (4) негативный контроль: создать worktree без записи в реестре -> пульс обязан
      назвать его осиротевшим, а не живым.'
  notes: null
