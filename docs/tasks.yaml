    note: 'CI-SKILL-PROOF-GATE-IS-MACOS-ONLY-01: test-skill-proof-gate.sh зелёная
      на macOS и красная на Linux CI — последнее, что держит зелёный main и, через
      него, включение обязательных проверок (SD-CI-REQUIRE-STATUS-CHECKS-01). Прогон
      33703800486 на ubuntu-latest, коммит 692fd94f: PASS=10 FAIL=6 — ''shellcheck:
      leadv2-skill-proof.sh'', ''shellcheck: leadv2-proof-lib.sh'', ''(a) valid+passing
      expected GREEN exit 0, got rc=1'', и два ''(e) mixed tree'' по счётчикам. Та
      же сюита на этом маке, тот же коммит: rc=0, PASS=16 FAIL=0, обе shellcheck-проверки
      зелёные (замерено лидом 2026-09-03T01:40Z). bash -n проходит на ОБЕИХ платформах,
      то есть это не синтаксис. Две независимые причины: (1) test-skill-proof-gate.sh:60-64
      запускает ''shellcheck -x'' и валит тест по любому ненулевому коду — локально
      shellcheck 0.11.0, на ubuntu-latest старее, findings отличаются, то есть вердикт
      сюиты зависит от того, какой shellcheck оказался на машине; (2) падения (a)
      и (e) — это поведение самого гейта в рантайме, а не линт, и диагностировать
      их надо отдельно. Запрет: НЕ вносить сюиту в known-red-suites.txt ради зелёного
      CI — аллоу-лист для унаследованных красных, прятать в нём свежий платформенный
      баг это ровно та лгущая зелень, против которой в репо есть правило.'
  notes: null
