      plugins/leadv2/scripts/lib/leadv2-route-arbiter.sh:102 — ''if x.get(status)!=ok:
      return (100.0, True)'', то есть неудачная ПРОБА квоты возвращает утилизацию
      100% с пометкой unknown, а не «неизвестно». Отсюда живая строка журнала ''route_resolved
      arm=refuse reason=all_arms_capped util_glm=6 util_codex=100 util_claude=unknown_capped
      util_freepool=0'' — линия DRIFT-GUARDS-TO-CANON-01 встала «за неимением армов»
      при GLM, свободном на 94%. Счётчик: all_arms_capped встречается 28 раз в журналах
      задач. В том же репо для тех же данных задокументирована ПРОТИВОПОЛОЖНАЯ политика
      — leadv2-router-v2.py работает fail-open; две несовместимые политики на одну
      величину. Нужно: (1) непрочитанная проба даёт «неизвестно», а не «исчерпано»
      — арм с неизвестной квотой ранжируется ниже известно-свободного, но остаётся
      допустимым; (2) инвариант last_resort: отказ по причине квоты структурно невозможен,
      пока хоть один арм ниже своего порога — если все неизвестны, берётся самый дешёвый
      и решение журналируется как last_resort; (3) две политики сводятся к одной,
      в одном месте; (4) негативный контроль: подсунуть состояние codex=100, claude=проба-упала,
      glm=6 -> маршрут обязан выбрать glm; вернуть fail-closed -> проба краснеет.
