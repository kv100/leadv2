    note: 'STATE-OWNER-WRITE-GATE-01: запретить запись в active.yaml мимо объявленного
      владельца. Рычаг из независимого мнения Codex Sol в PLUGIN-VERDICT-01, выбран
      как максимальный выхлоп на единицу работы всеми четырьмя мнениями вместе: он
      не требует, чтобы владелец состояния уже существовал, но немедленно останавливает
      рост самой частой формы дефекта, пока транзакционный модуль строится. Измерено:
      active.yaml упоминают 126 скриптов, пишут 73; журнал диспатчей 55/13; локи 72/21;
      phases.d 11/3. Формулировка Codex дословно: «запасной писатель — это не отказоустойчивость,
      это невереионированная вторая реализация базы данных». Требования: (1) манифест
      владельцев — по одному владеющему модулю на каждый долгоживущий артефакт; (2)
      статическая проверка на коммите отвергает любую запись в артефакт из скрипта,
      не объявленного владельцем (os.replace, перенаправление в путь, вызов встроенного
      сериализатора); (3) существующие 73 писателя вносятся в список исключений с
      датой, и список может только сокращаться — проверка падает, если он вырос; (4)
      негативный контроль: добавить новый прямой писатель -> проверка краснеет; убрать
      её -> случай зеленеет. Восемь открытых задач (DISPATCH-PHASE-DEADLOCK-01, DISPATCH-LEDGER-DEDUP-BLOCKS-REDISPATCHE-01,
      DEAD-TASK-CANNOT-BE-REDISPATCHED-01, DISPATCH-REFUSAL-SELF-PERPETUATES-01, REVIEW-ROUND-LOST-ON-LANE-HANDOFF-01,
      LANES-SNAPSHOT-HANGS-01, PULSE-READS-THE-WRONG-REGISTRY-01, STALE-ROW-STARTING-GRACE-01)
      — симптомы этого же корня; они не удаляются, а привязываются сюда и должны умереть
      сами, когда владелец появится.'
  notes: null
