    note: 'SKILL-USAGE-IS-UNMEASURED-01: мы не знаем, пользуется ли плагин своими
      скилами — это не измеряется. Замерено 2026-09-03: на диске 89 скилов (41 в plugins/leadv2/skills/,
      48 в .claude/skills/). Единственный учёт, leadv2-skill-usage-tally.sh, видит
      40 и даёт ''total=40 dispatch=5 wired=27 dormant=6 deferred=2'' — но его собственная
      шапка (строки 6-16) говорит, что WIRED значит ''имя встречается в commands/*.md,
      docs/*.md или hooks/hooks.json'', а DORMANT — ''нигде не упоминается вне своей
      папки''. Это учёт УПОМИНАНИЙ В ТЕКСТАХ, а не вызовов: leadv2-review показывает
      refs=52 dispatch=0, то есть 52 раза упомянут и ни разу не посчитан вызванным.
      Ни одна колонка не отвечает на вопрос ''сколько раз этот скил сработал за неделю
      и помог ли''. Работа в двух шагах, порядок обязателен. ШАГ 1 — измерить: телеметрия
      фактического вызова скила (кто, когда, в какой фазе, чем кончилось), сводка
      за период, и на её основе честная таблица ''вызывался / не вызывался ни разу
      / вызывался и не помог''. Без этого шага любая чистка — резня вслепую. ШАГ 2
      — действовать по измерению, а не по догадке: скил, ни разу не вызванный за месяц
      при живых поводах, либо встраивается в путь, где повод возникает, либо удаляется;
      скил, который вызывается и не меняет исход, переписывается или удаляется. Запрет:
      не удалять и не ''инлайнить'' ни одного скила до того, как появится измерение
      вызовов — сейчас DORMANT означает лишь ''о нём не пишут в доках'', и по этому
      признаку удалять нельзя. Смежная строка про обучение роутинга: ARBITER-ESTIMATES-BLIND-AND-NEVER-LEARNS-01.'
