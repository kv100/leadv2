# deny-extra.yaml — codex-lead-only deny rules, layered on top of the
# canonical plugins/leadv2/config/leadv2-deny-patterns.yaml floor.
#
# These three rules have no Claude-side equivalent (see CODEX-LEAD-FULL-01
# prepass §0.2): they are new, not a port, and never edit the canonical file.
# Same field shape as the canonical yaml, plus:
#   kind:      "regex" (default if omitted) | "predicate"
#   predicate: function name in lv2guard.sh, only meaningful when kind is
#              "predicate" — the regex field still gates whether the
#              predicate runs at all.
#
# Missing/unreadable/zero-rule-parse of this file fails the WHOLE guard
# closed (rc 97) — see lv2guard.sh CB-2. An unknown `kind:` value skips only
# that one rule with a stderr warning.
#
# GITGLOBAL fragment (GUARD-RESET-FLAG-GAP-01, 2026-08-24): git global flags
# between `git` and the subcommand (-C <path>, -c k=v, --git-dir, --no-pager,
# ...) must not defeat a rule. Every rule that starts with `git` inlines this
# fragment verbatim right after the `git` token (single physical line; the
# lv2guard parser has no include/anchor mechanism):
#
#   (?:\s+(?:-[cC]\s*\S+|--(?:git-dir|work-tree|namespace|exec-path|super-prefix|attr-source|config-env)(?:=\S*|\s+\S+)|-{1,2}[A-Za-z][A-Za-z0-9-]*(?:=\S*)?))*
#
# Any NEW rule beginning with `git` MUST include this fragment — the
# fragment-drift check in tests/test-deny-floor.sh fails the suite otherwise.
#
# CODEX-LEAD-PLUGIN-01: plugin_uninstall_floor added — a floor the guarded
# agent can remove with one command is a floor with one bypass (prepass §5.3).


rules:
  - name: worktree_prune_active_lanes
    kind: predicate
    predicate: worktree_prune_active_lanes
    regex: 'git(?:\s+(?:-[cC]\s*\S+|--(?:git-dir|work-tree|namespace|exec-path|super-prefix|attr-source|config-env)(?:=\S*|\s+\S+)|-{1,2}[A-Za-z][A-Za-z0-9-]*(?:=\S*)?))*\s+worktree\s+prune\b'
    enabled: true
    message: "git worktree prune while a lane is registered active is blocked — a live lane's worktree could be destroyed mid-flight. Close/unregister the lane in active.yaml first."
    allow_inline_override: false

  - name: codex_exec_direct
    kind: regex
    regex: '\bcodex\s+exec\b'
    enabled: true
    message: "Direct 'codex exec' is blocked — route through codex-task.sh so tiering/--reason/journalling still apply."
    allow_inline_override: false

  - name: heredoc_oversize
    kind: predicate
    predicate: heredoc_oversize
    regex: '<<[-~]?\s*\S'
    enabled: true
    message: "Heredoc body exceeds the advisory size threshold — consider a file instead. Advisory only; the command still runs."
    allow_inline_override: true

  # MERGED-BATCH-FIXROUND-01 H1: three explicit rules, not one lookahead —
  # the parser silently skips a rule whose regex fails to compile, so one
  # clever regex covering all shapes would be one point of silent failure
  # for all of them. re.IGNORECASE is applied by the matcher, so case
  # variants are covered for free.
  - name: plugin_uninstall_floor
    kind: regex
    regex: 'codex\s+plugin\s+(remove|uninstall)\b.*\bleadv2\b'
    enabled: true
    message: "Removing the leadv2 plugin disables the enforced deny floor — a floor the guarded agent can remove with one command is no floor. If removal is truly needed, the founder runs it by hand."
    allow_inline_override: false

  - name: plugin_marketplace_remove_floor
    kind: regex
    regex: 'codex\s+plugin\s+marketplace\s+(remove|rm)\b.*\bleadv2\b'
    enabled: true
    message: "Removing the leadv2-local marketplace disables the enforced deny floor by starving the plugin of updates — a floor the guarded agent can remove with one command is no floor. If removal is truly needed, the founder runs it by hand."
    allow_inline_override: false

  - name: plugin_disable_floor
    kind: regex
    regex: 'codex\s+plugin\s+disable\b.*\bleadv2\b'
    enabled: true
    message: "Disabling the leadv2 plugin disables the enforced deny floor — a floor the guarded agent can disable with one command is no floor. If disabling is truly needed, the founder runs it by hand."
    allow_inline_override: false
