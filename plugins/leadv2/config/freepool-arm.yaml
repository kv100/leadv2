# model_rank — FREEPOOL-MODEL-SELECTOR-01 (founder order): the freepool arm
# must never pin one static model. Before each worker spawn,
# leadv2-freepool-model-select.sh walks this list in order, intersects it
# against the proxy's live GET /v1/models route ids (prefix match), and
# liveness-probes the first match. First candidate that answers wins; a
# probe failure advances to the next rank. This list is DATA, not code — add
# a rank by editing this file, no script change needed.
#
# `prefix` matches against the START of a live route id returned by the
# proxy (e.g. "anthropic/deepseek/deepseek-chat"), so it does not need to be
# a full route id — the proxy may expose several date/size variants under
# one logical model family. The selector tolerates the prefix given either
# with or without the "anthropic/" alias segment (leadv2-freepool-model-select.sh
# tries both).
#
# Verified live 2026-08-26 against GET http://127.0.0.1:8317/v1/models on the
# running free-claude-code proxy (1033 routes across 6 providers: nvidia_nim,
# open_router, groq, gemini, deepseek, mistral) — each prefix below matched
# at least one live route id at verification time.
model_rank:
  # Rewritten 2026-08-30 round 2 (FREEPOOL-MAKE-IT-EARN-ITS-KEEP-01). The
  # 2026-08-27 list above scored a 1-token status-code-only probe, which
  # cannot see a live trap: measured 2026-08-30 against the real proxy, the
  # top three of that list (deepseek-v4-pro, kimi-k3, gemini-3.7-flash) all
  # answer HTTP 200 with content[].text == " " (whitespace only) at a small
  # max_tokens budget -- not a dead route, an INVISIBLE one. Root cause
  # (docs/handoff/FREEPOOL-MAKE-IT-EARN-ITS-KEEP-01/report.md §2): the proxy
  # leaves reasoning to the provider default (free_claude_code core/
  # reasoning.py ReasoningPolicy.provider_default()), so a reasoning-capable
  # model spends its whole tiny token budget on invisible reasoning before
  # any visible text -- fixed at the probe layer (64-token content-checked
  # probe, see leadv2-freepool-model-select.sh's _probe), not by removing
  # these models, since a bigger budget resolves it for most of them.
  #
  # This list is now ordered from a real bakeoff (a small bash-editing task,
  # `bash -n`-clean + correct output decides), not the 1-token probe:
  # docs/handoff/FREEPOOL-MAKE-IT-EARN-ITS-KEEP-01/bakeoff/round2/*.verdict.txt.
  # `nvidia_nim/deepseek-ai/deepseek-v4-pro-0813` is EXCLUDED here (not just
  # demoted): it failed the bakeoff outright twice at a real-work token
  # budget (500 tokens -> no response after 90s; retried at 500 tokens -> no
  # response after 125s) even though the same route answers fast (200,
  # blank) at max_tokens=10. A route that reliably hangs the full probe
  # timeout on real work costs more dispatch latency than it is worth;
  # re-admit it once a fresh probe shows it completing real-work requests.
  - prefix: "groq/openai/gpt-oss-120b"
    tier: primary
    why: "Fastest correct route in the round-2 bakeoff (1s, real bash generated and ran correctly). Best general default for throughput."
  - prefix: "mistral/mistral-code-latest"
    tier: secondary
    why: "Second provider, 1s, correct in the round-2 bakeoff -- survives a Groq quota wall."
  - prefix: "nvidia_nim/nvidia/nemotron-3-super-120b-a12b"
    tier: tertiary
    why: "Not in the previous list at all -- round-2 bakeoff added it and it passed cleanly (35s, correct). Third provider."
  - prefix: "nvidia_nim/moonshotai/kimi-k3"
    tier: quaternary
    why: "Best independently-benchmarked agentic coder in reach and passed the round-2 bakeoff (67s, correct) -- slow but real, kept below the fast/reliable tier."
  - prefix: "gemini/models/gemini-3.7-flash"
    tier: quinary
    why: "Passed the round-2 bakeoff (33s, correct) but was flaky under repeated probing in the same session (a separate short-prompt probe timed out at 40s) -- broadest fallback before the caller drops to paid Claude."

# role_rank — per-role ranking, populated 2026-08-27 from a live measured probe of
# every candidate route plus independent-benchmark research. Callers set FREEPOOL_ROLE
# (implement/bulk/review/read); a missing role defaults to implement, while a missing
# block or empty list falls back silently to the flat model_rank above.
#
# HOW THIS SET WAS CHOSEN — two hard exclusions first, because they define the shape:
#
#   1. NO `open_router/*` ROUTES AT ALL. The OpenRouter key reports
#      `is_free_tier: false` with real (if tiny) spend and NO spend limit, so every
#      unmarked open_router route BILLS US. And the `:free` variants are not a way out:
#      13 of the 14 probed — including `z-ai/glm-5.2:free`,
#      `nvidia/nemotron-3-ultra-550b-a55b:free` and `minimax/minimax-m3:free` —
#      returned `rate_limit_error` at 0.0s, i.e. an instant refusal rather than a slow
#      answer. OpenRouter is therefore neither free nor available; it is excluded as a
#      provider, not merely deprioritised. Only `cohere/north-mini-code:free` answered
#      (2.2s), and one working route does not justify readmitting the provider.
#
#   2. NO ROUTE THAT ANSWERED WRONG OR DID NOT ANSWER. The probe asked what `${x:-y}`
#      evaluates to when x is the empty string (correct: `y` — the colon makes an empty
#      value count as unset). Excluded on that basis: `mistral/devstral-medium-latest`
#      and `mistral/devstral-2512` (both answered `""`, the answer for `${x-y}` without
#      the colon — the same error twice, so a trait and not a fluke);
#      `open_router/qwen/qwen3-max` (same wrong answer); `minimax-m2.1` and
#      `dots-3-note-preview` (burned the entire 256-token budget on thinking and never
#      answered — independently corroborated for MiniMax M2.x by upstream issues #52 and
#      #77); `gemini-3.1-pro-preview` (HTTP 429).
#
# WHAT SURVIVES: the native-provider free quotas. The important discovery is that
# NVIDIA NIM serves free exactly the top-tier models OpenRouter charges for —
# kimi-k3, deepseek-v4-pro, nemotron-3-ultra, minimax-m3.
#
# Latencies below are measured, single-sample, from this machine on 2026-08-27. They
# rank ties; they are not a benchmark. Slow is acceptable here by founder decision
# (2026-08-27) — hence the 30s probe timeout, without which most of these are invisible.
role_rank:
  # Multi-file code writing. Instruction adherence and correctness dominate; a minute
  # of latency is cheaper than a wrong diff.
  # Re-ranked 2026-08-30 round 3 by the latency-only selector timings in
  # docs/handoff/FREEPOOL-MAKE-IT-EARN-ITS-KEEP-01/round3-selector/. No
  # discriminating bash-3.2 editing bakeoff was run or recorded that round;
  # this ordering is not a correctness or model-quality claim.
  # REORDERED 2026-09-01 (founder decision, FREEPOOL-IMPLEMENT-BY-ENDURANCE-01).
  # The previous order was latency-only and said so in its own `why` lines
  # ("not a correctness ranking", "no round-3 correctness bakeoff was
  # recorded"). Latency is the wrong criterion for THIS role: `implement` is a
  # multi-step agentic lane, not a single completion.
  #
  # Measured 2026-09-01 on a real lane (SUITE-LOCK-ORPHAN-FD-04, run
  # 260901-113657): `mistral/mistral-code-latest` was selected, read one file,
  # ran `git diff --stat`, narrated the output and ended the turn after FOUR
  # messages -- 90k input tokens for zero work, and the run still recorded
  # `outcome: completed`. Fast and shallow is worse than slow and complete
  # here, because a lane that stops early reports success.
  #
  # So this role now leads with the two models with actual agentic evidence,
  # and keeps the fast pair as fallbacks. bulk/read/review are NOT changed --
  # there latency really is the right criterion.
  implement:
    - prefix: "nvidia_nim/nvidia/nemotron-3-super-120b-a12b"
      tier: primary
      why: "Strongest independently-benchmarked coding score in reach (SWE-bench 60.5) and passed the round-2 correctness bakeoff cleanly. Slower per call; this role pays for completion, not for latency."
    - prefix: "nvidia_nim/moonshotai/kimi-k3"
      tier: secondary
      why: "Best independently-benchmarked AGENTIC coder available to us -- the previous ordering said exactly this and still ranked it fourth on latency alone. Distinct lineage from rank 1."
    - prefix: "groq/openai/gpt-oss-120b"
      tier: tertiary
      why: "Fastest route and correct on SHORT tasks; demoted here because short-task correctness did not predict multi-step endurance. Still first for bulk/read."
    - prefix: "mistral/mistral-code-latest"
      tier: quaternary
      why: "Kept only as a provider-diversity fallback: measured 2026-09-01 ending a real lane after two tool calls while reporting completion."

  # Many near-identical edits. Throughput and consistency matter; reasoning depth does not.
  bulk:
    - prefix: "groq/openai/gpt-oss-120b"
      tier: primary
      why: "Fastest correct route measured (0.5s); Groq's inference speed is the whole point for high-volume mechanical work."
    - prefix: "groq/qwen/qwen3.8-27b"
      tier: secondary
      why: "Same provider's smaller model, 1.6s in the recorded selector timing; latency-only ordering."
    - prefix: "mistral/mistral-code-latest"
      tier: tertiary
      why: "2.0s in the recorded selector timing from a second provider; a latency fallback."
    - prefix: "nvidia_nim/minimaxai/minimax-m3"
      tier: quaternary
      why: "2.3s in the recorded selector timing via NIM; no round-3 correctness claim."

  # Adversarial review and bug hunting. Reasoning depth matters, latency does not.
  # REORDERED 2026-09-01 (founder decision, same reasoning as `implement`).
  # Review is judgment work, not throughput: a fast shallow model rubber-stamps
  # a diff, and a rubber-stamped review is exactly the lying-green failure the
  # review regime exists to prevent. The previous order was latency-only and
  # said so ("ordered by recorded latency rather than a round-3 correctness
  # oracle"). Depth first here, latency last.
  review:
    - prefix: "nvidia_nim/nvidia/nemotron-3-super-120b-a12b"
      tier: primary
      why: "Strongest measured coding score in reach (SWE-bench 60.5) -- a reviewer must out-reason the author, not answer faster."
    - prefix: "nvidia_nim/moonshotai/kimi-k3"
      tier: secondary
      why: "Best independently-benchmarked agentic coder available; distinct lineage from rank 1, so a shared blind spot is less likely."
    - prefix: "gemini/models/gemini-3.7-flash"
      tier: tertiary
      why: "Third provider, keeps an independent review path when both NIM routes are unavailable."
    - prefix: "groq/openai/gpt-oss-120b"
      tier: quaternary
      why: "Fast route, last-resort reviewer: measured strong on SHORT tasks, unproven on judgment across a whole diff."
    - prefix: "mistral/mistral-code-latest"
      tier: quinary
      why: "Last resort. Measured 2026-09-01 producing a suite with zero assertions that always exits 0 -- the exact failure a reviewer must catch."

  # Reads, summarisation, classification. Speed and frugality only.
  read:
    - prefix: "groq/openai/gpt-oss-120b"
      tier: primary
      why: "0.5s — nothing else measured comes close."
    - prefix: "groq/qwen/qwen3.8-27b"
      tier: secondary
      why: "1.6s, same provider, smaller footprint."
    - prefix: "gemini/models/gemini-3.5-flash"
      tier: tertiary
      why: "7.4s from a second provider; the fallback that survives a Groq quota wall."

# --- FP-05: runtime tuning knobs (env, read by lib/leadv2-freepool-model-select.sh) ---
# These are ENV VARS, not yaml keys — documented here because this file is the
# freepool operator surface. Defaults verified against the selector 2026-08-28:
#   FREEPOOL_ARM_CONFIG              path to THIS file (default: sibling ../../config/freepool-arm.yaml
#                                    resolved from the selector script location; per-file symlink installs
#                                    resolve to canonical thanks to physical-path resolution, fix 341b80a)
#   FREEPOOL_MODELS_CACHE_TTL_S      GET /v1/models cache TTL, default 60s — the 5s stale-fetch margin
#                                    inside the selector covers a cache written mid-probe
#   FREEPOOL_MODEL_PROBE_TIMEOUT_S   1-token liveness probe timeout, default 30s — raised from 8s
#                                    2026-08-27 because cold free-tier models (NIM) need warmup
#   FREEPOOL_ROLE                    implement|review|bulk — set by the dispatcher from TaskEstimate
#                                    work_kind (FP-01); unset falls back to implement
#   FREEPOOL_CAPABILITY_FLOOR        bulk_only|full — env override of the capability_floor KEY below
#                                    (FP-06); wins over the yaml key, unrecognized values ignored

# --- FP-06: capability floor knob (read by lib/leadv2-route-arbiter.sh) -------
# capability_floor controls the FP-08 freepool capability floor:
#   bulk_only (default) — freepool is rank-eligible only for bulk/simple code
#                         work; standard/heavy/strategic code demotes it to the
#                         last-resort chain position (FP-08 empty-diff incident).
#   full                — the floor never applies; freepool competes on cost
#                         for Standard/Heavy builds too (founder ask 2026-08-28).
# Env override FREEPOOL_CAPABILITY_FLOOR=bulk_only|full wins over this key; an
# unrecognized value at either layer falls back toward bulk_only, never
# silently unfloors. The dispatcher journals the resolved mode once per
# dispatch as `freepool_floor_mode mode=<m> source=<yaml|env|default>`.
capability_floor: bulk_only   # Standard+ production work stays floored; tests/docs-only is descriptor-exempt.
