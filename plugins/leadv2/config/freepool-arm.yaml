# freepool-arm.yaml — generated by freepool-install.sh. Pinned commit is what
# was actually checked out at /Users/kostiantyn.vlasenko/tools/free-claude-code at install time; a
# mismatch between this and a live `git -C $FREEPOOL_INSTALL_DIR rev-parse
# HEAD` means the local checkout drifted from what was reviewed/tested.
repo_url: https://github.com/Alishahryar1/free-claude-code.git
pinned_commit: 6b3f16f41d4b06ab1320c0d0e71007392a676348
install_dir: /Users/kostiantyn.vlasenko/tools/free-claude-code

# Provider API keys the proxy itself needs — NEVER set here, NEVER in git.
# Configure them in ${FREEPOOL_INSTALL_DIR}/.env per the cloned repo's own
# README/.env.example (exact names are UNVERIFIED until the repo is cloned in
# a network-enabled environment — see freepool-proxy.sh's ENTRYPOINT-UNVERIFIED
# note for the same caveat on the run command). Until that file has real
# values, leadv2-freepool-gate.sh's liveness probe fails closed (arm_down) and
# the router skips this arm by fact — no code change needed when keys land,
# only the .env file and a `freepool-proxy.sh start`.

# model_rank — FREEPOOL-MODEL-SELECTOR-01 (founder order): the freepool arm
# must never pin one static model. Before each worker spawn,
# leadv2-freepool-model-select.sh walks this list in order, intersects it
# against the proxy's live GET /v1/models route ids (prefix match), and
# liveness-probes the first match. First candidate that answers wins; a
# probe failure advances to the next rank. This list is DATA, not code — add
# a rank by editing this file, no script change needed.
#
# `prefix` matches against the START of a live route id returned by the
# proxy (e.g. "anthropic/deepseek/deepseek-chat"), so it does not need to be
# a full route id — the proxy may expose several date/size variants under
# one logical model family.
model_rank:
  - prefix: "deepseek/deepseek-chat"
    tier: primary
    why: >-
      Best free-tier coding benchmark among the pooled providers (HumanEval /
      SWE-bench-style tasks) at the time this list was authored — strongest
      default pick for a code-writing worker.
  - prefix: "nvidia_nim/nvidia/nemotron-3-super"
    tier: secondary
    why: >-
      Large parameter count with competitive coding/reasoning scores;
      second choice when deepseek's route is absent or unhealthy.
  - prefix: "groq/llama-4"
    tier: tertiary
    why: >-
      Groq's inference speed keeps turnaround low even though raw coding
      quality trails the top two — a reasonable fallback under time
      pressure rather than a quality pick.
  - prefix: "mistral/mistral-large"
    tier: quaternary
    why: >-
      Solid general-purpose coding ability, kept last as the broadest
      fallback before the caller gives up on freepool routing entirely and
      falls back to the static "sonnet" alias.
