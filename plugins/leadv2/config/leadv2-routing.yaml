# Smart routing v2 additions.  The legacy per-phase routing table remains
# repo-local at .claude/ref/leadv2-routing.yaml; this canonical registry is
# copied there by plugin sync when v2 is enabled.
router_v2:
  # Advisory capability data (per-arm scores + confidence + sources):
  #   plugins/leadv2/config/model-capability.yaml
  # Not consumed by scoring yet (MODEL-BENCH-DATA-01). Cost policy wins.
  # Used only when the current session credential cannot be identified.  The
  # quota reader reports account_resolution=pinned_unresolved in that case.
  active_account: max_20x

  # usable_now is remaining percentage-points per hour, not percent used.
  headroom_weights:
    - min_usable_now: 8
      weight: 1.0
    - min_usable_now: 2
      weight: 0.7
    - min_usable_now: 0
      weight: 0.4
    - min_usable_now: null
      weight: 0.2

  # ── Quota ceilings, founder decision 2026-08-02 ───────────────────────────
  # Two ceilings per provider: ordinary work, and a HIGHER one for review, because
  # review is the last thing we want to skip when quota gets tight. A provider is
  # withdrawn from the ladder for ordinary work at `work_pct` and stays available
  # for review until `review_pct`.
  #
  #   glm    work 80  · review 90
  #   codex  work 90  · review 95
  #   claude work 95  · review 95   (weekly)
  #
  # These are ceilings on the WEEKLY window. Today only glm has an enforcing
  # reader (leadv2-glm-quota-gate.sh, default 80) and it does not distinguish
  # review from ordinary work; codex and claude have no ceiling reader at all.
  # Until that lands, these numbers are declared policy, NOT enforced behaviour —
  # do not cite them as if the machine obeyed them.
  quota_ceilings:
    glm:    { work_pct: 80, review_pct: 90 }
    codex:  { work_pct: 90, review_pct: 95 }
    claude: { work_pct: 95, review_pct: 95 }

  # T17 route arbiter capability matrix. This is data, not a second ladder.
  # `cost` is a relative unit used only among capable, uncapped arms.
  #
  # T17 fix-round (C1): `kinds:` must carry the vocabulary real callers
  # actually pass, not just the abstract code|docs|review|plan|audit|safety
  # set. `grep -rhoE '--kind "[^"]+"' scripts/*.sh scripts/lib/*.sh` on
  # d6179df showed the only two literal values ANY caller sends are
  # fanout-class-funnel (leadv2-fanout.sh, leadv2-fanout-lane-launcher.sh) and
  # backlog-pump (leadv2-backlog-pump.sh) -- neither was in this matrix, so
  # every fanout lane and every backlog-pump dispatch hard-refused
  # (all_arms_capped, dispatch exit 4) with every arm under ceiling. Both are
  # ordinary build-kind work (not review/plan/audit/safety), so they are
  # listed on the same cells as `code`. The arbiter (leadv2-route-arbiter.sh)
  # also normalizes any OTHER out-of-vocabulary --kind value to `code` as a
  # second, defensive layer -- this matrix entry is the first-class one so the
  # journal shows the real kind, not a silent rewrite.
  capability_matrix:
    - { arm: glm, provider: glm, model: glm-5.3, tier: standard, cost: 1, kinds: [code, docs, audit, fanout-class-funnel, backlog-pump], sizes: [standard, heavy, bulk], tags: [bulk, background], review: false, protected: false }
    # GLM-53-FLASH-ARM-01 (founder order 2026-08-26): glm-5.3-flash, the CHEAP
    # glm-family arm. GLM-EFFICIENCY-01 (founder ruling on ask q-bba84179,
    # 2026-09-02, option b): cost corrected 0.4 -> 0.33 against Z.AI's measured
    # credit multipliers (docs.z.ai/devpack/teamplan.md, fetched 2026-09-02):
    # flash 2.3 in / 0.56 cached / 8 out vs glm-5.3 6.9 / 1.7 / 24 — exactly ⅓,
    # i.e. flash's advertised "3x the quota" means 3x the ALLOWANCE, not 3x the
    # cost. The old 0.4 was a legacy-plan figure; the direction (flash cheapest)
    # was always right. Flash stays preferred on trivial/light/standard.
    # `cost: 0.33` is that credit-weight ratio expressed in the arbiter's only
    # economic unit (relative cost among capable, uncapped arms) — a STATIC
    # preference note, not a quota model: the arbiter scores provider-level
    # utilization, not per-model consumption, so no per-arm quota math was
    # added in this round. Good for mechanical edits, small fixes, doc rounds,
    # test authoring. NOT for protected/safety/publish (protected: false here
    # plus `untrusted: true` on the ladder entry below), NOT review/audit/plan,
    # and sizes stop at standard — heavy/bulk stay on glm-5.3/codex/sonnet.
    - { arm: glm-flash, provider: glm, model: glm-5.3-flash, tier: standard, cost: 0.33, kinds: [code, docs, fanout-class-funnel, backlog-pump], sizes: [standard], tags: [cheap, mechanical], review: false, protected: false }
    - { arm: freepool, provider: freepool, model: freepool-default, tier: standard, cost: 1, kinds: [code, docs, fanout-class-funnel, backlog-pump], sizes: [standard, bulk], tags: [bulk, background], review: false, protected: false }
    - { arm: codex, provider: codex, model: gpt-5.6, tier: volume, cost: 3, kinds: [code, docs, review, plan, audit, fanout-class-funnel, backlog-pump], sizes: [standard], tags: [review, adversarial], review: true, protected: true } # PLUGIN-PAPERCUTS-01 defect 2: was tier: spark — codex-task.sh rejects spark (banned, founder directive 2026-04-28; accepts top|standard|volume only), so this cell won the auction and died at spawn. volume (gpt-5.6-luna/low) is the launcher's cheapest valid tier for this cheap leg.
    - { arm: codex, provider: codex, model: gpt-5.6, tier: standard, cost: 4, kinds: [code, docs, review, plan, audit, fanout-class-funnel, backlog-pump], sizes: [standard, heavy], tags: [review, adversarial], review: true, protected: true }
    - { arm: codex, provider: codex, model: gpt-5.6, tier: top, cost: 7, kinds: [code, review, plan, audit, fanout-class-funnel, backlog-pump], sizes: [heavy], tags: [adversarial, exhaustive], review: true, protected: true }
    - { arm: haiku, provider: claude, model: haiku, tier: standard, cost: 2, kinds: [docs, audit, plan], sizes: [standard], tags: [classify, audit], review: true, protected: true }
    - { arm: sonnet, provider: claude, model: sonnet, tier: standard, cost: 5, kinds: [code, docs, review, plan, audit, fanout-class-funnel, backlog-pump], sizes: [standard, heavy], tags: [integration, ui_judgment], review: true, protected: true }
    - { arm: opus, provider: claude, model: opus, tier: high, cost: 9, kinds: [review, plan, audit, safety], sizes: [standard, heavy], tags: [architecture, safety, adversarial], review: true, protected: true }

  # EFFORT-IS-NOT-WIRED-01: the second routing knob (docs/model-effort-matrix.md
  # -- model = hardness, effort = marginal value of extra thinking) resolved
  # from the SAME winning capability_matrix cell the arbiter already picked,
  # never a second decision and never an `if arm==X` branch in the script.
  # Rows are evaluated top-to-bottom against the winning cell's `tags`/`kinds`/
  # `protected`; first match wins. `default: true` is the mandatory catch-all
  # last row. Doctrine mapping (model-effort-matrix.md): adversarial review /
  # safety judgment / architecture (`plan`) / a protected final verdict ⇒
  # high; mechanical / classify / cheap work ⇒ low; everything else
  # (ordinary build/fix) ⇒ medium. Adding a row here changes routing outcomes
  # with no script edit -- that is the anti-hardcoding property under test.
  effort_matrix:
    - { tags: [adversarial], effort: high }
    - { tags: [safety], effort: high }
    - { kinds: [safety], effort: high }
    - { kinds: [plan], effort: high }
    - { protected: true, effort: high }
    - { tags: [mechanical], effort: low }
    - { tags: [classify], effort: low }
    - { tags: [cheap], effort: low }
    - { default: true, effort: medium }
  # COMPLEXITY-ESTIMATOR-IS-OFF-01: the arbiter's `cheapest_capable` sort (the
  # ecost() function in leadv2-route-arbiter.sh) previously had no notion of
  # how hard a task is -- kind/size/protected pick the eligible cells, `cost`
  # alone breaks the tie. Each rule here adds `penalty` to the effective cost
  # of any capable cell whose `tags` intersect `penalize_tags`, but ONLY when
  # the dispatch's judge-estimated complexity/duration_class matches. Data-
  # driven, additive: an empty list (or a rule that never matches) reproduces
  # today's pure-cost behavior byte-for-byte. Never names an arm directly --
  # matches on the SAME `tags` capability_matrix cells already carry (cheap/
  # mechanical/bulk/background), so a routing-yaml-only edit (no script
  # change) is enough to retune which cells count as "too cheap" for hard work.
  complexity_penalty:
    - complexities: [complex]
      penalize_tags: [cheap, mechanical, bulk, background]
      penalty: 100

  # Arms are (channel, model) pairs.  Quota buckets are scopes, so the three
  # Anthropic arms deliberately share the active Max x20 account bucket.
  #
  # NOTE 2026-08-02 (updated ARM-LADDER-HAS-NO-QUOTA-PRECHECK-01): the dispatch
  # order now comes from router.dispatch_ladder above. This arms list remains
  # for advisory/quota-bucket purposes. The dispatcher builds candidate_arms
  # from dispatch_ladder, not from this list.
  arms:
    - id: glm
      # Live acceptance evidence: plugins/leadv2/docs/evidence/glm-5.3-probe.md.
      channel: glm-coder.sh
      model: glm-5.3
      bucket: glm
      reserve_threshold: 2
      reserve_allow: [review]
    # GLM-53-FLASH-ARM-01: same channel (glm-coder.sh, model selected via its
    # GLM_MODEL env), same glm quota bucket and lockout scope. Never a
    # reviewer — glm family is in DEFAULT_REVIEW_EXCLUSIONS, glm-flash included.
    - id: glm-flash
      channel: glm-coder.sh
      model: glm-5.3-flash
      bucket: glm
      reserve_threshold: 2
    # RETIRED 2026-08-05 (DISPATCH-KIMI-ARM-MISMATCH-01, founder order 2026-08-04
    # «Кими убрать»): kimi is not a dispatchable build arm. Uncomment this block to
    # restore it — the launcher implementation (kimi) spawn case, _apply_kimi_admission,
    # _wait_kimi_verdict, KIMI_BIN) is intact and still works.
    # - id: kimi
    #   model: moonshotai/kimi-k3-free
    #   bucket: kimi
    #   reserve_threshold: 2
    #   reserve_allow: [review]
    - id: freepool
      # T19 (founder decision 2026-08-26): local proxy in front of free-tier
      # providers (Alishahryar1/free-claude-code). health_gated: true means
      # this arm's own gate (leadv2-freepool-gate.sh) can refuse independently
      # of quota — a proxy with no keys configured yet, or one breaching its
      # rolling error-rate/latency window, is arm_down/gate_broken by FACT,
      # not by a hand-kept exclusion list. Standard/bulk only until a week of
      # first-pass review-rate data (T17) clears it for Heavy/integration —
      # never protected/safety/publish/UI-judgment regardless of data.
      channel: freepool-coder.sh
      model: freepool-default
      bucket: freepool
      reserve_threshold: 2
      # T19 fix-round (L3): no reserve_allow: [review] here -- it contradicted
      # DEFAULT_REVIEW_EXCLUSIONS = ["glm", "freepool"] in
      # lib/leadv2-glm-policy-resolve.py, added by this same T19 change. freepool
      # never reviews its own or anyone else's diff.
      health_gated: true
    - id: codex
      channel: codex-task.sh
      model: gpt-5.6-terra
      bucket: codex
      reserve_threshold: 2
      reserve_allow: [review]
    - id: claude-haiku
      channel: claude-subsession.sh
      model: haiku
      bucket: anthropic:max_20x
      reserve_threshold: 2
      reserve_allow: [review]
    - id: claude-sonnet
      channel: claude-subsession.sh
      model: sonnet
      bucket: anthropic:max_20x
      reserve_threshold: 2
      reserve_allow: [review]
    - id: claude-opus
      channel: claude-subsession.sh
      model: opus
      bucket: anthropic:max_20x
      reserve_threshold: 2
      reserve_allow: [review]

# CODEX-GATE-01 item 6: in-lane DEFAULT protected-path patterns consumed by
# lib/leadv2-review-signals.sh (the safety source for the product-close review pool). This is
# the safety net so a tenant override (.claude/ref/leadv2-routing.yaml) that lacks this key
# never silently fail-closes kimi review everywhere. Patterns are bash globs (`*` spans `/`),
# matched against the task's lane-write paths. Covers the same three areas the routing yaml's
# sonnet_exceptions `safety_gate_publish_payments / when: protected_path` rule names:
# safety-gate, publish, payments. First yaml in the ordered lookup that carries this key wins.
router:
  # ARM-LADDER-HAS-NO-QUOTA-PRECHECK-01 P1: the ordered dispatch ladder.
  # dispatch-code.sh reads this list to build candidate_arms — it no longer
  # carries a hardcoded fallback order. The resolver's primary arm starts the
  # candidate list; every arm after it in this order is a fallback. Changing
  # this list changes dispatch routing.
  #
  # Each entry:
  #   id       — arm identifier used in the dispatch script's case/spawn logic
  #   provider — the quota/lockout scope (one lockout record covers all arms
  #              on the same provider)
  #   model    — the model the arm dispatches
  #   when     — task kinds this arm is eligible for (advisory; the resolver
  #              decides the primary arm from glm_policy rules, this list
  #              governs fallback eligibility)
  #   effort   — effort tier for the arm's provider
  #   review_rank — dispatch-8e2a32be (D3): integer rank used ONLY by the review-pool
  #              resolver's non-empty floor (leadv2-glm-policy-resolve.py:_review_floor).
  #              Present only on Anthropic-account arms today (haiku < sonnet < opus <
  #              fable). floor(author) escalates to the next-higher rank above the
  #              author, or the highest rank if the author is already at/above the top
  #              -- so the review pool can never end up genuinely empty just because
  #              codex+glm are both quota-locked and the author is an Anthropic arm.
  #              Absent key on an entry = that arm never participates in the floor
  #              (build-only arms like glm/codex/kimi keep their own quota gating
  #              instead). Never read for build-ladder ordering -- see dispatch: false
  #              note on the two review-only entries below.
  dispatch_ladder:
    - id: glm
      provider: glm
      model: glm-5.3
      when: [all]
      effort: standard
    # GLM-53-FLASH-ARM-01: the CHEAP glm-family arm, first fallback after
    # glm-5.3 (the route arbiter ranks it ahead on cost 0.33 whenever a
    # standard-size mechanical cell matches). `untrusted: true` reuses the
    # T19 protected/safety chain-strip mechanism — for freepool it encodes
    # third-party trust, for glm-flash it encodes the model-class rule that a
    # flash model never touches a protected/safety/publish chain, even as a
    # fallback position. `when:` stops at standard: heavy/bulk/strategic
    # fallback legs skip flash (mechanical tier only). Same glm provider =>
    # one lockout record covers both glm arms.
    - id: glm-flash
      provider: glm
      model: glm-5.3-flash
      when: [trivial, light, standard]
      effort: standard
      untrusted: true
    # RETIRED as a build arm (founder order 2026-08-04 «Кими убрать», executed as
    # 3398d11 / DISPATCH-KIMI-ARM-MISMATCH-01). The entry stays so _arm_provider
    # can name the provider if a stale tenant yaml ever hands back arm=kimi, but
    # dispatch: false makes the ladder loader skip it. T19: freepool below is the
    # kimi replacement in the bulk ladder (glm -> codex -> sonnet -> freepool).
    - id: kimi
      provider: kimi
      model: moonshotai/kimi-k3-free
      when: [all]
      effort: standard
      dispatch: false
    - id: codex
      provider: codex
      model: gpt-5.6-terra
      when: [all]
      effort: standard
    - id: sonnet
      provider: anthropic
      model: sonnet
      when: [all]
      effort: standard
      review_rank: 2
    # T19 (founder decision 2026-08-26): Standard/bulk from day one, parallel-
    # eligible. Positioned LAST -- glm -> codex -> sonnet -> freepool, matching
    # the ladder comment above (the kimi replacement in the bulk ladder).
    # T19 fix-round (review FAIL on 009d0b6, C1): the prior comment here claimed
    # glm_policy.protected_path_patterns already excluded protected/safety/
    # publish/payments tasks "for every arm on this ladder" -- false on both
    # counts (protected_path_patterns only sets the DC_PROTECTED signal for the
    # resolver's PRIMARY-arm pick; it never touches the fallback chain, and the
    # plugin yaml had no sonnet_exceptions row for the safety rule to fire on
    # in the first place, see glm_policy.sonnet_exceptions below). `untrusted:
    # true` is the real guard: _build_candidate_chain (leadv2-dispatch-code.sh)
    # strips every untrusted arm from the chain whenever DC_PROTECTED=1 or
    # DC_SAFETY=1, at every chain position, and journals arm_excluded
    # reason=protected_path so the skip is a fact, not a comment.
    # Heavy/integration eligibility is data-gated (T17): `when: [light,
    # standard, bulk]` is enforced by _build_candidate_chain against
    # --task-class (default "standard"; unset for a caller that never
    # resolved a size class, which keeps today's behaviour).
    # ARMS-ADMISSION-01 (ROUTER-ARBITER-DISAGREE-ON-FREEPOOL-01): `light` was
    # missing here while leadv2-route-arbiter.sh's SIZE_MAP has always folded
    # light into the 'standard' capability cell for freepool (see FP-08's own
    # comment there: "trivial|light... must stay freepool-eligible"), so the
    # ladder and the arbiter disagreed on the exact same task_class. The
    # arbiter's behaviour is the one the founder already signed off on
    # (FP-06/FP-08) -- this ladder now agrees with it instead of the arbiter
    # being the sole source of truth for `light`.
    - id: freepool
      provider: freepool
      model: freepool-default
      when: [light, standard, bulk]
      effort: standard
      health_gated: true
      untrusted: true
    # dispatch-8e2a32be (D3): review-only entries, never build-dispatched (dispatch:
    # false, same posture as fable below) -- they exist here solely so the review-pool
    # floor has a provider mapping + rank for every Anthropic-account arm the review
    # path can actually invoke (run_reviewer_arm's generic claude-subsession.sh --model
    # <arm> branch already handles any arm name, haiku/opus included).
    - id: haiku
      provider: anthropic
      model: haiku
      when: [review]
      effort: standard
      dispatch: false
      review_rank: 1
    - id: opus
      provider: anthropic
      model: opus
      when: [review]
      effort: high
      dispatch: false
      review_rank: 3
    # Architect-path models — expressed here so the config is the single
    # source of truth, but never dispatched by dispatch-code.sh (the plan
    # workflow uses fable directly via workflows/leadv2-plan.js).
    - id: fable
      provider: anthropic
      model: fable
      when: [architect, heavy]
      effort: high
      dispatch: false
      review_rank: 4
  glm_policy:
    protected_path_patterns:
      - "*safety-gate*"
      - "*safety_gate*"
      - "*safety*gate*"
      - "*publish*"
      - "*payments*"
      - "*payment*"
    # T19 fix-round (review FAIL on 009d0b6, C1b): this canonical plugin yaml
    # had NO sonnet_exceptions key at all, so the resolve_glm_policy()
    # precedence rows below (leadv2-glm-policy-resolve.py:707-722) could never
    # fire in a repo that inherits this config directly (ROUTING_YAML falls
    # back here when a tenant's .claude/ref/leadv2-routing.yaml is absent) --
    # a protected/safety/publish/payments task resolved arm=glm instead of
    # sonnet, verified live: `--signals '{"protected_path":true,
    # "safety_touched":true}'` returned `arm=glm reason=glm_default` before
    # this fix. Mirrors the tenant-repo shape (persona-engine's
    # .claude/ref/leadv2-routing.yaml:77-87) so the plugin config is no longer
    # a silent exception to its own safety rule.
    sonnet_exceptions:
      - id: safety_gate_publish_payments
        when: protected_path
      - id: integration_critical_4subsystems
        when: subsystem_count>=4 or needs_midflight_interaction
      - id: ui_design_judgment
        when: ui_design_judgment
      - id: glm_failed_twice
        when: glm_failure_count>=2
      - id: glm_lock_busy_no_second_channel
        when: glm_lock_busy
