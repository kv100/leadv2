# Smart routing v2 additions.  The legacy per-phase routing table remains
# repo-local at .claude/ref/leadv2-routing.yaml; this canonical registry is
# copied there by plugin sync when v2 is enabled.
router_v2:
  # Advisory capability data (per-arm scores + confidence + sources):
  #   plugins/leadv2/config/model-capability.yaml
  # Not consumed by scoring yet (MODEL-BENCH-DATA-01). Cost policy wins.
  # Used only when the current session credential cannot be identified.  The
  # quota reader reports account_resolution=pinned_unresolved in that case.
  active_account: max_20x

  # usable_now is remaining percentage-points per hour, not percent used.
  headroom_weights:
    - min_usable_now: 8
      weight: 1.0
    - min_usable_now: 2
      weight: 0.7
    - min_usable_now: 0
      weight: 0.4
    - min_usable_now: null
      weight: 0.2

  # Arms are (channel, model) pairs.  Quota buckets are scopes, so the three
  # Anthropic arms deliberately share the active Max x20 account bucket.
  arms:
    - id: glm
      channel: glm-coder.sh
      model: glm-5.2
      bucket: glm
      reserve_threshold: 2
      reserve_allow: [review]
    # KIMI REMOVED 2026-08-02 by founder decision — «убери кими, нам не нужен этот провайдер,
    # никогда больше ничего не надо через него делать». Measured that day: 19 dispatches, 19
    # returned `work=no` — zero productive lanes — while it was picked as the spill arm every
    # time glm's lock was busy, which made it the session's single largest waste. This is NOT
    # the usual "cool an arm down by measurement" case the house rule protects; it is an
    # explicit founder removal of a provider. Do not re-add without the founder saying so.
    # NOTE: removing the arm here is necessary but NOT sufficient — leadv2-dispatch-code.sh
    # carries hardcoded `kimi)` cases (_spawn_worker_body, refusal handling ~1483-1574) that
    # do not read this file. Those are being removed in their own lane.
    - id: codex
      channel: codex-task.sh
      model: gpt-5.6-terra
      bucket: codex
      reserve_threshold: 2
      reserve_allow: [review]
    - id: claude-haiku
      channel: claude-subsession.sh
      model: haiku
      bucket: anthropic:max_20x
      reserve_threshold: 2
      reserve_allow: [review]
    - id: claude-sonnet
      channel: claude-subsession.sh
      model: sonnet
      bucket: anthropic:max_20x
      reserve_threshold: 2
      reserve_allow: [review]
    - id: claude-opus
      channel: claude-subsession.sh
      model: opus
      bucket: anthropic:max_20x
      reserve_threshold: 2
      reserve_allow: [review]

# CODEX-GATE-01 item 6: in-lane DEFAULT protected-path patterns consumed by
# lib/leadv2-review-signals.sh (the safety source for the product-close review pool). This is
# the safety net so a tenant override (.claude/ref/leadv2-routing.yaml) that lacks this key
# never silently fail-closes kimi review everywhere. Patterns are bash globs (`*` spans `/`),
# matched against the task's lane-write paths. Covers the same three areas the routing yaml's
# sonnet_exceptions `safety_gate_publish_payments / when: protected_path` rule names:
# safety-gate, publish, payments. First yaml in the ordered lookup that carries this key wins.
router:
  glm_policy:
    protected_path_patterns:
      - "*safety-gate*"
      - "*safety_gate*"
      - "*safety*gate*"
      - "*publish*"
      - "*payments*"
      - "*payment*"
