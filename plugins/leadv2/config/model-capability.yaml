# model-capability.yaml — ADVISORY capability data (MODEL-BENCH-DATA-01).
# NOT a routing policy. Cost policy (glm/kimi first) always wins over any score here.
# Entries whose `confidence` is low MUST NOT be used in scoring.
# Nothing reads this file yet — it is data-only until a resolver change lands.
# MODEL-BENCH-DATA-01 — machine-readable model capability data for router weighting.
# asof: 2026-07-31. See model-capability-data.md in the same directory for full sourcing,
# caveats, and the trust-filter narrative behind every number here.
#
# score_basis matters: swebench-verified and swebench-pro are NOT the same scale
# (same model can score ~19pts lower on Pro than Verified). Never compare coding_score
# across arms with different score_basis values as if they were equivalent.
#
# confidence:
#   high   = independent leaderboard (vals.ai / artificialanalysis.ai), fetched directly
#   medium = aggregator citing an independent source, or a single vendor-adjacent source
#            with no contradiction found
#   low    = vendor self-report only, conflicting sources, or no independent confirmation found
#
# cost_class here is COST-TO-US under existing subscription/quota arrangements, not public
# list price (list price is included in notes where found, for context).
#
# FABLE-THINK-TIER-01: model-capability.yaml is now READ by one consumer —
# leadv2-router.sh think_model(), which routes every THINKING role to fable
# with opus as the fallback. The contract: the fable row may carry
# `unavailable: true` (e.g. sunset like FABLE-RETIRE-01) — think_model() then
# returns opus. Absent/unavailable=false means fable serves think roles.
# `role:`/`fallback:`/`model_id:` fields are data for that contract; `role`
# NEVER overrides routing policy (cost-first glm/kimi arms unchanged).

fable:
  model_id: claude-fable-5-1
  underlying_model: claude-fable-5-1
  role: think            # FABLE-THINK-TIER-01: default arm for every thinking role
  fallback: opus
  coding_score: 95.0
  score_basis: swebench-verified
  agentic_score: 80.52
  agentic_basis: terminal-bench-2.1
  speed_class: slow
  # ROUND-2: context_k is UNVERIFIED — the 1M-context claim was never measured
  # here; reverted to unverified until a live check proves it.
  context_k: unverified
  # ROUND-2: fable gets its OWN bucket entry. The round-1 claim "same Claude Max
  # bucket as Opus" was NOT proven by probe: five_hour on the active account did
  # not move across the probe (31% -> 31%), and the live reader exposes a
  # model-scoped weekly window for Fable distinct from weekly_all:
  #   evidence: quota-read delta 2026-09-01 21:02:03Z/21:03:17Z,
  #     leadv2-quota-read.py anthropic --no-cache ->
  #     "kind": "weekly_scoped", "scope": {"model": {"display_name": "Fable"}},
  #     pct 7 on max_20x before AND after a tiny
  #     `claude -p --model claude-fable-5-1 'say ok'` (rc=0, not refused);
  #     five_hour_pct 31 -> 31 on the active max_20x account.
  # Bucket identity with opus is therefore UNPROVEN; glm-policy-resolve.py
  # still maps fable onto the anthropic ACCOUNT reading (conservative — it
  # blocks with the account ceiling) but must not be described as same-bucket.
  cost_class: fable-scoped-weekly
  confidence: high
  notes: >
    SWE-V and TB2.1 both vals.ai-direct (high confidence). FABLE-THINK-TIER-01
    (2026-09-01, founder order): Fable 5.1 GA — think roles (plan synthesis,
    judge, diagnose synth, learn proposal, PO audit, review Heavy critic,
    architect prepass, lead main model) resolve to fable first; opus is the
    fallback when fable is refused/unavailable (`unavailable: true` here) —
    not the default. ROUND-2 evidence tags:
    evidence: model_id claude-fable-5-1 — Claude Code environment banner,
      verbatim: "Model IDs — Fable 5.1: 'claude-fable-5-1', Opus 5:
      'claude-opus-5', Sonnet 5: 'claude-sonnet-5'"; confirmed live by the
      probe `claude -p --model claude-fable-5-1 'say ok'` returning rc=0.
    evidence: quota-read delta 2026-09-01 — five_hour_pct 31->31 and a
      pre-existing weekly_scoped window scoped to display_name "Fable"
      (pct 7, unchanged) across the probe; the SAME-BUCKET claim is withdrawn
      and cost_class is fable's own scoped window.
    context_k: UNVERIFIED (was 1000 in round 1) — no measured 1M-context check
      exists; restore a number only after a live context probe.
    Speed_class=slow is an inference from reasoning-tier positioning, not a
    measured tok/s (low confidence on speed specifically).
  sources:
    - https://www.vals.ai/benchmarks/swebench
    - https://www.vals.ai/benchmarks/terminal-bench-2-1
  asof: "2026-07-31"
  round2_probed: "2026-09-01T21:03:17Z"

opus:
  model_id: claude-opus-5
  underlying_model: claude-opus-5
  role: think_fallback   # FABLE-THINK-TIER-01: serves think roles only when fable is unavailable/refused
  coding_score: 97.0
  score_basis: swebench-verified
  agentic_score: 84.64
  agentic_basis: terminal-bench-2.1
  speed_class: slow
  context_k: 1000
  cost_class: quota-scarce
  confidence: high
  notes: >
    SWE-V and TB2.1 both vals.ai-direct (high confidence, current #1 on both in our fleet).
    context_k=1000 (1M) sourced from a single pricing aggregator (eesel/coursiv) — could not
    independently verify against Anthropic's own model card; treat context_k as medium
    confidence only. Escalation tier per existing routing policy; this data supports keeping
    it as the ceiling arm, not as a default.
  sources:
    - https://www.vals.ai/benchmarks/swebench
    - https://www.vals.ai/benchmarks/terminal-bench-2-1
    - https://www.eesel.ai/blog/claude-opus-5-pricing
  asof: "2026-07-31"

sonnet:
  model_id: claude-sonnet-5
  underlying_model: claude-sonnet-5
  coding_score: 72.7
  score_basis: swebench-verified
  agentic_score: 74.53
  agentic_basis: terminal-bench-2.1
  speed_class: medium
  context_k: 200
  cost_class: quota-scarce
  confidence: low
  notes: >
    coding_score is DISPUTED: one aggregator cites 72.7% (attributed to Anthropic's own
    launch post), another cites 82.1% for what should be the same figure — a 10pt spread I
    could not resolve without reaching Anthropic's model card directly. Used the more
    conservative number. Not present in vals.ai's own top-7 SWE-V list (below Grok 4.5's
    86.6%), which is at least consistent with the lower figure. agentic_score (TB2.1 74.53) IS
    vals.ai-direct and high confidence on its own. Re-verify coding_score before using it in
    any weighted formula.
  sources:
    - https://www.vals.ai/benchmarks/terminal-bench-2-1
    - https://baeseokjae.github.io/posts/claude-sonnet-5-review-2026/
    - https://www.siliconreport.com/anthropics-claude-sonnet-5-breaks-80-on-swe-bench-verified-widens-benchmarks-over-competit-220e6417
  asof: "2026-07-31"

