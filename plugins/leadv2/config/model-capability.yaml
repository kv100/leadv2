kimi:
  underlying_model: kimi-k3
  coding_score: 93.4
  score_basis: swebench-verified
  agentic_score: 80.9
  agentic_basis: terminal-bench-2.1
  speed_class: slow
  context_k: 1000
  cost_class: free
  confidence: high
  notes: >
    coding_score and agentic_score both vals.ai-direct, high confidence. Moonshot's OWN
    self-report SWE-bench number is only 76.8% — 17pts BELOW the independent number, an
    unusual under-claim direction worth remembering when comparing vendor vs independent
    numbers elsewhere in this dataset. Also holds rank 1 on the Frontend Code Arena (Elo
    1679, ahead of Fable 5's 1631 and GPT-5.6 Sol's 1618) — a real independently-observed
    result, but narrow to frontend/UI code, not general agentic coding; do not read this as
    "kimi beats Fable 5 and GPT Sol 5.6" in general (see verdict in the .md report — that
    broader claim is NOT supported by SWE-V or TB2.1, where kimi trails or ties both).
    context_k=1000 (1M) high confidence (Moonshot official + OpenRouter). speed_class=slow is
    an OPERATIONAL finding, not a benchmark: Moonshot's own docs confirm reasoning_effort is
    currently locked to max with reasoning tokens billed as output — matches this project's
    own experience needing stall-guards for kimi. cost_class=free reflects our internal
    TokenRouter arrangement as described by the team; Moonshot's PUBLIC list price is
    $3/1M input ($0.30 cache-hit) / $15/1M output — NOT free. The free-to-us status is
    trusted-but-unverified from Moonshot's side; flag if TokenRouter behavior ever changes.
  sources:
    - https://www.vals.ai/benchmarks/swebench
    - https://www.vals.ai/benchmarks/terminal-bench-2-1
    - https://codersera.com/blog/kimi-k3-benchmarks-comparison-2026/
    - https://www.eesel.ai/blog/kimi-k3-pricing
    - https://openrouter.ai/moonshotai/kimi-k3
  asof: "2026-07-31"
