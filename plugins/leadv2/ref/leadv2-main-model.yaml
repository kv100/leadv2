# leadv2-main-model.yaml — plugin default for the lead's own main model.
# LEAD-IS-OPUS-THINK-IS-FABLE-01 (founder order 2026-09-03): the lead's main
# model and the think-role model are two SEPARATE axes — "лид на опусе, а вот
# архитекторы и т.д. на fable". FABLE-THINK-TIER-01 R4 had collapsed them (the
# lead inherited whatever the think resolver picked, so fresh installs got a
# Fable lead); that collapse is reversed here. The lead is a thin router (talk
# to the founder, classify, dispatch, adjudicate) — Opus 5 is the default;
# leadv2-main-model-check.sh runs Opus guardrails when main_model=opus and
# falls back to sonnet if one fails. Fable 5.1 stays the default for the
# THINKING roles (architect, plan synthesis, judge) via the think resolver
# (lib/leadv2-think-model.sh) — unrelated to this file.
#
# This is the plugin's OWN copy (plugins/leadv2/ref/). A project's per-repo
# override lives at that project's .claude/ref/leadv2-main-model.yaml and
# takes precedence there — do NOT edit persona-engine's (or any other repo's)
# copy from here.
main_model: opus
