# Production-mutation catalog for leadv2 (BACKLOG-ONLY-GROWS-CLOSING-IS-MANUAL-01).
#
# Schema mirrors persona-engine's tests/mutations/catalog.yaml (the only prior
# catalog in the fleet): one entry per known production-behaviour mutation.
# This repo's canonical mutation runner is plugins/leadv2/scripts/
# leadv2-mutation-control.sh — it applies the mutation in a scratch copy of
# the lane, runs the named suite against it, and requires the suite to go RED
# (killed). An entry is NEVER deleted to make the kill rate look better; if an
# anchor rots, fix the anchor.
#
# Baseline: 3/3 killed on 2026-09-04 (artifacts under
# docs/handoff/BACKLOG-ONLY-GROWS-CLOSING-IS-MANUAL-01/mutation-control/).
# 2026-09-04 PHASE-GATE-DEFAULT-CLASS-ESCAPES-IT-01: +5 entries, 8/8 killed
# (artifacts under docs/handoff/PHASE-GATE-DEFAULT-CLASS-ESCAPES-IT-01/
# mutation-control/; the warn-trace control ran as a unified-diff patch —
# macOS BSD sed degenerates its `${...}`-bearing anchor into an empty match).
# 2026-09-05 ARBITER-REMEMBERS-FAILURES-01: +2 entries, 10/10 killed (artifacts
# under docs/handoff/ARBITER-REMEMBERS-FAILURES-01/mutation-control/ — two
# leadv2-mutation-control.sh runs, plus run.sh, an independent harness whose log
# shows WHICH cases each mutation reddens; note that the canonical runner's
# `red_line=` field quoted a PASS line on the second control, so read the verdict
# from its exit status and from negative-controls.log, not from that field).
# 2026-09-05 PHASE-GATE-NAMES-EVERYTHING-AT-ONCE-01: +2 entries, both killed
# (artifacts under docs/handoff/PHASE-GATE-NAMES-EVERYTHING-AT-ONCE-01/
# mutation-control/).
#
# THE RUNNING TOTAL IN THIS HEADER WAS WRONG AND IS NOW DERIVED, NOT CARRIED.
# The line here used to read "now 8/8" while the file already held ELEVEN
# entries: the three smart-arbiter-* rows were added without updating it. Both
# 2026-09-05 lanes then incremented the stale number (10/10, 12/12) instead of
# counting. Corrected 2026-09-05 by counting: **15 entries, all expected:
# killed.** Do not increment this sentence — recount it:
#     python3 -c "import yaml;d=yaml.safe_load(open('tests/mutations/catalog.yaml'));\
#                 print(len(d['mutations']))"
# An entry is never deleted to make the number look better; a number that is
# carried instead of measured is the same disease one layer up.

mutations:
  - id: phase8-backlog-row-call-removed
    product_flow: "lane close on a success outcome removes its founder backlog row (the seam call itself)"
    file: plugins/leadv2/scripts/leadv2-phase8-close.sh
    anchor: |
      if ! bash "${_p8c_row_bin}" "${_p8c_row_sid}" \
    patch: |
      if ! true \
    expected: killed

  - id: phase8-backlog-row-closes-on-refused
    product_flow: "non-success outcomes (refused, no_work) must leave the backlog row open"
    file: plugins/leadv2/scripts/leadv2-phase8-close.sh
    anchor: |
      if [[ "${OUTCOME}" == "completed_success" || "${OUTCOME}" == "completed_with_warnings" ]]; then
    patch: |
      if true; then
    expected: killed

  - id: phase8-backlog-row-ambiguous-resolves-first
    product_flow: "a founder task resolving to >=2 backlog rows closes NOTHING (never a partial/first match)"
    file: plugins/leadv2/scripts/leadv2-phase8-close.sh
    anchor: |
      hits = [it for it in items if isinstance(it, dict) and row_matches(it, founder)]
    patch: |
      hits = [it for it in items if isinstance(it, dict) and row_matches(it, founder)][:1]
    expected: killed

  # PHASE-GATE-DEFAULT-CLASS-ESCAPES-IT-01 (2026-09-04) — the phase gate's
  # permissive default and its silent passages.
  - id: phase-gate-canonicalizes-class-before-mode
    product_flow: "an unrecognized class spelling reaching the phase gate (ledger-borne lowercase heavy, garbage) is canonicalized and ENFORCED, never silently warned"
    file: plugins/leadv2/scripts/leadv2-dispatch-code.sh
    anchor: |
      cls="$(_lv2_class_canonical "${cls}")"
    patch: |
      cls="${cls}"
    expected: killed

  - id: phase-gate-warn-leaves-a-trace
    product_flow: "warn mode journals phase_precondition_warn with class and missing phases on every rc=3 passage"
    file: plugins/leadv2/scripts/leadv2-dispatch-code.sh
    anchor: |
      && emit decision "phase_precondition_warn task=${sig8} class=${cls} missing=${missing_csv} mode=warn"
    patch: |
      && emit decision "phase_precondition_nowarn task=${sig8} class=${cls} missing=${missing_csv} mode=warn"
    expected: killed

  - id: phase-gate-light-trivial-keep-warn
    product_flow: "Light/Trivial keep the historical warn default — the gate is correct, not merely strict"
    file: plugins/leadv2/scripts/leadv2-dispatch-code.sh
    anchor: |
      Light|Trivial)
    patch: |
      LightTrivialDisabled)
    expected: killed

  - id: phase-gate-pass-leaves-a-trace
    product_flow: "a satisfied pass journals phase_precondition_pass"
    file: plugins/leadv2/scripts/leadv2-dispatch-code.sh
    anchor: |
      emit decision "phase_precondition_pass task=${sig8} class=${cls} mode=${mode} scope=${scope}"
    patch: |
      : # pass trace removed
    expected: killed

  - id: phase-gate-bootstrap-leaves-a-trace
    product_flow: "a bootstrap admission journals phase_precondition_bootstrap with class and would_be_missing (the dispatch-96d97702 silent hole)"
    file: plugins/leadv2/scripts/leadv2-dispatch-code.sh
    anchor: |
      emit decision "phase_precondition_bootstrap task=${sig8} class=${cls} would_be_missing=${_boot_csv} mode=${mode} scope=${scope}"
    patch: |
      : # bootstrap trace removed
    expected: killed

  # SMART-ARBITER-01 — three fixes, one control each (2026-09-04).
  # Evidence base: 569 live `route_resolved by=arbiter` journal lines, 190
  # from 2026-09-03/04 (census: docs/handoff/SMART-ARBITER-01/census.md).

  - id: smart-arbiter-effort-task-first
    product_flow: "effort follows the TASK: task-keyed effort_matrix rows (kinds/sizes/complexity/duration_class/protected) are evaluated before arm-tag rows, so a standard build won by glm-flash resolves medium, never low from the arm's cheap/mechanical tags (43 live build decisions at effort=low, 2026-09-03/04)"
    file: plugins/leadv2/scripts/lib/leadv2-route-arbiter.sh
    anchor: |
      for _row in (_task_rows+_arm_rows):
    patch: |
      for _row in (_arm_rows):
    expected: killed

  - id: smart-arbiter-canonical-protected-glm
    product_flow: "canonical sonnet_exceptions carries no protected_path row: protected/safety tasks resolve glm primary (GLM-DOES-ANY-WORK-01, founder 2026-09-04) while every kept exception still fires sonnet (84 sonnet-at-cost-5 live decisions 2026-09-03/04 with glm idle)"
    file: plugins/leadv2/config/leadv2-routing.yaml
    anchor: |
      sonnet_exceptions:
    patch: |
      sonnet_exceptions:
        - id: safety_gate_publish_payments
          when: protected_path
    expected: killed

  - id: smart-arbiter-route-reason-token
    product_flow: "route_resolved journal keeps reason=cheapest_capable when floor tokens ride the same line: the capture is anchored on a space-prefixed reason=, not the greedy last reason= token (23 corrupted live decision lines on 2026-09-04)"
    file: plugins/leadv2/scripts/leadv2-dispatch-code.sh
    anchor: |
      _arb_reason="$(printf '%s\n' "${_arb_out}" | sed -n 's/.*[[:space:]]reason=\([^ ]*\).*/\1/p')"
    patch: |
      _arb_reason="$(printf '%s\n' "${_arb_out}" | sed -n 's/.*reason=\([^ ]*\).*/\1/p')"
    expected: killed

  # ARBITER-REMEMBERS-FAILURES-01 (founder 2026-09-05). Both anchors sit INSIDE a
  # function body of the arbiter's python heredoc, so the mutant changes routing
  # behaviour rather than merely breaking the file — a top-level insert would
  # redden every suite for the wrong reason and read like a successful control.
  - id: arbiter-failure-memory-stops-counting
    product_flow: "an arm that spawned and produced nothing twice on THIS task signature must lose its turn to the next arm in the chain"
    file: plugins/leadv2/scripts/lib/leadv2-route-arbiter.sh
    suite: plugins/leadv2/scripts/tests/test-route-arbiter-failure-memory.sh
    anchor: |
      if arm: counts[arm]=counts.get(arm,0)+1
    patch: |
      if arm: pass
    expected: killed
    note: "kills 4 cases (the ban, its absence from chain=, threshold=2, all-banned yielding); every edit-B case stays green, so the control is specific"

  - id: arbiter-unknown-is-capped-again
    product_flow: "a provider whose quota probe did not answer is NOT a busy provider: it stays selectable (demoted) and is named by probe_outage= instead of being absorbed into all_arms_capped"
    file: plugins/leadv2/scripts/lib/leadv2-route-arbiter.sh
    suite: plugins/leadv2/scripts/tests/test-route-arbiter-failure-memory.sh
    anchor: |
      if unk.get(provider): return False
    patch: |
      if False: return False
    expected: killed
    note: "kills exactly 1 case (probe outage still refused); every edit-A case stays green. Reproduces the measured production bug: util_codex=unknown_capped in 122 of 143 decisions, six lanes killed by all_arms_capped when the instrument failed, not the quota"

  # PHASE-GATE-NAMES-EVERYTHING-AT-ONCE-01 (2026-09-05). Both anchors are inside
  # a function body of leadv2-phase-record.sh, and each control is specific: the
  # first reddens only the name-the-contract cases, the second only the
  # refuse-the-dead-record cases.
  - id: phase-gate-names-only-its-own-scope
    product_flow: "one refusal must name the class's WHOLE mandatory contract, so no phase is ever discovered by re-dispatching (each discovery cost a full dispatch cycle, ~2 min)"
    file: plugins/leadv2/scripts/leadv2-phase-record.sh
    suite: plugins/leadv2/scripts/tests/test-phase-gate-names-everything.sh
    anchor: |
      required_full[*]
    patch: |
      required_full_DISABLED[*]
    expected: killed
    note: "kills 4 cases (a1,a2,a4,a5); every defect-2 case stays green. The anchor deliberately avoids a ${...}-bearing pattern — macOS BSD sed degenerates those into an empty match"

  - id: phase-record-writes-the-dead-record-anyway
    product_flow: "a `done` record whose artifact cannot hash is knowably dead at write time and must refuse, writing nothing — writing it ends the lane's bootstrap grace without satisfying the gate, turning an admissible lane into a refused one"
    file: plugins/leadv2/scripts/leadv2-phase-record.sh
    suite: plugins/leadv2/scripts/tests/test-phase-gate-names-everything.sh
    anchor: |
      exit 5
    patch: |
      _proof="unverified"
    expected: killed
    note: "kills 3 cases (b1,b2,b5); every defect-1 case stays green. b5 shows the real harm: with the record written, the very next assert refuses (missing=classify,plan,gate1) instead of admitting the lane at bootstrap"

  # WRITESET-CAROUSEL-01 (2026-09-05). Both anchors are inside the body of
  # _lv2_ws_live_worker() in leadv2-active-registry.sh, and the two controls are
  # disjoint: the first reddens only the no-process cases, the second only the
  # bystander-lead case.
  - id: writeset-pidless-row-counts-as-a-worker
    product_flow: "an incumbent lane row with an undeclared write set and NO process under it is UNKNOWN overlap, not conflict — blocking on it refuses every dispatch in the repo on behalf of a lane that does not exist"
    file: plugins/leadv2/scripts/leadv2-active-registry.sh
    suite: plugins/leadv2/scripts/tests/test-writeset-carousel.sh
    anchor: |
      if pid in (None, "", "null", "None"):
    patch: |
      /if pid in (None, "", "null", "None"):/{n;s/return False/return True/;}
    expected: killed
    note: "kills 3 cases (1,4,6); the live-worker and proven-overlap cases stay green. Reproduces the measured production bug: at 2026-09-05T02:52Z the live registry held 18 rows of exactly this shape (pid: None, writes undeclared), five of them inside the 900s window, and each one on its own refused every dispatch — a lead that cleared one blocker was refused by the next, 47 seconds old"

  - id: writeset-bystander-lead-counts-as-a-worker
    product_flow: "a lane row carrying an INTERACTIVE lead session's pid is alive and is not a worker; treating it as one makes the row immortal, because the liveness check answers `alive` truthfully forever"
    file: plugins/leadv2/scripts/leadv2-active-registry.sh
    suite: plugins/leadv2/scripts/tests/test-writeset-carousel.sh
    anchor: |
      return _proc_kind(pid) != "interactive"
    patch: |
      s/return _proc_kind(pid) != "interactive"/return True/
    expected: killed
    note: "kills exactly 1 case (3); every no-process case stays green. _proc_kind() was built for this exact question by PHASE-REFUSAL-LEAVES-A-LANE-REGISTERED-01 and the write-set guard never consulted it"

  # SUITE-SELECTION-COVERS-140-OF-390-01 (2026-09-05). The first control mutates
  # the guard's own predicate; the second mutates the SUITE CORPUS, which is the
  # honest control here — it reproduces the production defect (a suite silently
  # losing its trigger) rather than a proxy for it.
  - id: suite-selection-guard-ignores-the-marker
    product_flow: "a suite no change-scoped run ever selects proves nothing when it is green — 260 of 427 suites were in that state, including three named test-active-regist* while leadv2-active-registry.sh changed under them"
    file: plugins/leadv2/scripts/tests/test-suite-selection-coverage.sh
    suite: plugins/leadv2/scripts/tests/test-suite-selection-coverage.sh
    anchor: |
      grep -q '^# run-all-triggers:' "$f"
    patch: |
      s|grep -q '\^# run-all-triggers:' "$f"|grep -q '^# NEVER-MATCHES-run-all-triggers:' "$f"|
    expected: killed
    note: "kills case 1 only (every suite becomes an orphan); the declaration-file cases and the parser case stay green. Proves the guard reads the marker instead of assuming it"

  - id: a-suite-silently-loses-its-trigger
    product_flow: "the regression this guard exists to catch: a suite drops its `# run-all-triggers:` line and quietly leaves the change-scoped selection set without anything going red"
    file: plugins/leadv2/scripts/tests/test-active-registry-failclosed.sh
    suite: plugins/leadv2/scripts/tests/test-suite-selection-coverage.sh
    anchor: |
      # run-all-triggers:
    patch: |
      s|^# run-all-triggers:.*$|# (marker removed by the negative control)|
    expected: killed
    note: "kills case 1 and names EXACTLY the one suite that lost its marker — the mutation is applied to the corpus, not to the guard, so it reproduces the real defect"

  # REVIEW-GATE-IS-MUTE-01 (2026-09-05). Both anchors are inside the verdict/
  # fan-out block of leadv2-review-run.sh. The first restores the measured
  # production output byte for byte; the second keeps the knowledge and removes
  # only the saying, which is a different failure and reddens different cases.
  - id: review-gate-calls-a-mute-arm-healthy
    product_flow: "a review arm that RAN and produced no readable verdict contributed nothing, and the gate said `degraded=false` and listed it in `arms:` anyway — the lane merged on one opinion believing it had two"
    file: plugins/leadv2/scripts/leadv2-review-run.sh
    suite: plugins/leadv2/scripts/tests/test-review-gate-names-the-unreadable.sh
    anchor: |
      _REVIEW_UNREADABLE="${_REVIEW_UNREADABLE:+${_REVIEW_UNREADABLE},}$1=$2"
    patch: |
      s|  _REVIEW_UNREADABLE="\${_REVIEW_UNREADABLE:+\${_REVIEW_UNREADABLE},}\$1=\$2"|  :|
    expected: killed
    note: "kills cases 1, 2, 4; the verdict-unchanged, all-readable and no-readable-arm cases stay green. The mutant reproduces the live 2026-09-05 measurement exactly: `degraded=false ... reason=none` and `unreadable=none` beside a mute arm"

  - id: review-gate-knows-and-does-not-say
    product_flow: "the gate computes which arms it could not read and then does not print it — the same shape as the arbiter's unknown flag, which existed and never reached a decision"
    file: plugins/leadv2/scripts/leadv2-review-run.sh
    suite: plugins/leadv2/scripts/tests/test-review-gate-names-the-unreadable.sh
    anchor: |
      UNREADABLE_LINE="$(printf 'unreadable: %s'
    patch: |
      s|UNREADABLE_LINE="\$(printf 'unreadable: %s' "\${_REVIEW_UNREADABLE:-none}")"|UNREADABLE_LINE=""|
    expected: killed
    note: "kills cases 1 and 5 only — degraded is still forced true, so case 2 stays green. Proves the gate FILE is asserted, not just the decision line"

  # MUTATION-CONTROL-DIFF-HASH-IS-THE-EMPTY-HASH-01 (2026-09-05). Controls on the
  # control machinery itself. The first removes the PROPERTY (both producer
  # guards) rather than one implementation of it — measured: a single-site
  # mutation left the property intact and the mutant survived on the first run.
  - id: mutation-control-stamps-an-empty-identity
    product_flow: "a mutation-control artifact whose lane_diff_hash is the sha256 of an EMPTY diff still proves the suite reddens, but stops proving it reddens ON THIS WORK — and every such artifact is indistinguishable from every other"
    file: plugins/leadv2/scripts/leadv2-mutation-control.sh
    suite: plugins/leadv2/scripts/tests/test-mutation-control-lane-identity.sh
    anchor: |
      if git -C "${ROOT}" diff --quiet "${MC_BASE}" HEAD
    patch: |
      s|^if git -C "${ROOT}" diff --quiet "${MC_BASE}" HEAD|if false \&\& git -C "${ROOT}" diff --quiet "${MC_BASE}" HEAD|; /LANE_DIFF_HASH}" == "e3b0c442/s|.*|if false; then|
    expected: killed
    note: "kills cases 1, 2, 3, 5; the positive control (case 4) and the consumer case stay green. Measured on 63 live artifacts: 8 carried the empty-diff hash, from 5 lanes, every one with a real and distinct diff_hash"

  - id: dod-gate-accepts-an-empty-identity
    product_flow: "the gate compared lane_diff_hash only against a value it recomputes the same way, so in the degenerate case BOTH sides were the empty-diff hash and compared EQUAL — the check confirmed itself on zero information"
    file: plugins/leadv2/scripts/lib/leadv2-dod-gate.sh
    suite: plugins/leadv2/scripts/tests/test-mutation-control-lane-identity.sh
    anchor: |
      [[ "${lane_hash}" != e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 ]] || return 1
    patch: |
      /lane_hash.*!= e3b0c442/s|.*|  :|
    expected: killed
    note: "kills case 6 only — every producer-side case stays green. The mirror of an existing guard: artifact_hash had been protected from this exact hash since it was written; lane_hash beside it had not"

  # FIVE-RED-SUITES-THE-GATE-SELECTS-01 (2026-09-05). The lane watcher's one
  # honest alarm. Measured: PyYAML lives under $HOME on this machine, so on a
  # bare runner the counter answered 0 forever and LANE-IDLE was permanently
  # mute -- silence being indistinguishable from health.
  - id: unreadable-queue-answers-zero
    product_flow: "docs/tasks.yaml exists but cannot be parsed (no YAML parser, or broken YAML) and the watcher reports it as zero queued work, so LANE-IDLE never fires and an idle lead looks exactly like a busy one"
    file: plugins/leadv2/scripts/leadv2-lane-watch-v2.sh
    suite: plugins/leadv2/scripts/tests/test-lane-watch-v2.sh
    anchor: |
      sys.exit(3)            # no parser at all -> UNKNOWN, never zero
    patch: |
      /no parser at all/s|.*|    print(0); sys.exit(0)|; /present but unparseable/s|.*|    print(0); sys.exit(0)|
    expected: killed
    note: "removes the PROPERTY, not one implementation -- both refusals become an answer of zero. Kills case r2-unknown in BOTH the ordinary and a scrubbed-$HOME environment; that is the point, since the property under test is exactly the one that must not depend on the environment"

  - id: watcher-knows-the-queue-is-unreadable-and-does-not-say
    product_flow: "the watcher computes that the queued count is unreadable and then takes no branch for it, so the operator sees the same output as a watcher with nothing to report"
    file: plugins/leadv2/scripts/leadv2-lane-watch-v2.sh
    suite: plugins/leadv2/scripts/tests/test-lane-watch-v2.sh
    anchor: |
      if [ "$queued_rc" -ne 0 ]; then
    patch: |
      /if \[ "\$queued_rc" -ne 0 \]; then/s|.*|  if false; then|
    expected: killed
    note: "the arbiter/review-gate shape one floor up: knowing and not saying. Kills case r2-unknown in both environments. A third assertion written alongside these two (r2-unknown-b) survived BOTH controls -- it asserted the ABSENCE of a LANE-IDLE count, which an answer of zero also satisfies -- and was deleted rather than kept for the count"

  # FIVE-RED-SUITES-THE-GATE-SELECTS-01 (2026-09-05). One control, two suites.
  # Both had a selection proof that grepped tests/run-all.sh for a literal row
  # in EXTRA_SUITE_MAP; 65734576 emptied that table and both assertions could
  # only ever fail. Re-pointed at the live seam, they now distinguish "no row
  # for me" from "no rows for anyone" -- which is exactly what this control
  # measures, and exactly what the old form could not say.
  - id: trigger-discovery-returns-an-empty-map
    product_flow: "run-all.sh --scope changed discovers no trigger rows at all, so every suite is silently unselectable and a green CI means nothing ran"
    file: tests/run-all.sh
    suite: plugins/leadv2/scripts/tests/test-lane-watch-v2.sh
    also_kills: plugins/leadv2/scripts/tests/test-skill-telemetry.sh
    anchor: |
      [[ -n "${_hits}" ]] || continue
    patch: |
      inside scan_suite_triggers() only, replace the first
      `[[ -n "${_hits}" ]] || continue` with a bare `continue`
    expected: killed
    note: "both suites go red naming the EMPTY map specifically, not a missing row -- the distinction is the property. Census by BEHAVIOUR (a fail() whose text names EXTRA_SUITE_MAP, not a mention of the string) found exactly two such assertions in the tree; the other 99 references are the line-2 migration comment and 6 more are fixture data in suites that test the parser itself"

  # FIVE-RED-SUITES-THE-GATE-SELECTS-01 (2026-09-05). The write-set conflict
  # checker. Fail-open is deliberate and is kept -- it must never be why a
  # dispatch fails. What was not deliberate is that "could not look" and
  # "looked, found nothing" left the same trace: silence and exit 0. Same
  # PyYAML-under-$HOME root as the lane-watch rows above; note that
  # leadv2-fanout.sh already fails CLOSED on the same unparseable registry,
  # so one input produced opposite behaviours in two neighbours.
  - id: overlap-checker-cannot-say-it-did-not-look
    product_flow: "with no YAML parser (CI, a fresh VPS, any container) the write-set overlap checker printed exactly what it prints for a clean tree, so every lane passed a check that never ran -- while the same lanes were being refused on a laptop"
    file: plugins/leadv2/scripts/leadv2-writes-overlap.sh
    suite: plugins/leadv2/scripts/tests/test-writes-overlap.sh
    anchor: |
      sys.exit(20)
    patch: |
      s = s.replace('sys.exit(20)', 'sys.exit(0)')
    expected: killed
    note: "removes the property at every producer site at once. Kills the two no-parser cases; it does NOT kill the liveness case, because that reason is raised in the shell rather than by the python exit -- two causes, two sites, and the control reports exactly that rather than pretending to cover both"

  - id: overlap-checker-knows-and-does-not-say
    product_flow: "the checker computes that it could not look and then announces nothing, so the operator sees a clean run"
    file: plugins/leadv2/scripts/leadv2-writes-overlap.sh
    suite: plugins/leadv2/scripts/tests/test-writes-overlap.sh
    anchor: |
      if [[ -n "$UNCHECKED_REASON" ]]; then
    patch: |
      replace that single line with `if false; then`
    expected: killed
    note: "kills all three: both no-parser cases and the liveness case. The arbiter / review-gate shape one floor up -- knowing and not saying. The stub package that removes PyYAML is a yaml.py on PYTHONPATH that raises ImportError, so the case reads the same on a host where PyYAML IS installed system-wide"

  # FIVE-RED-SUITES-THE-GATE-SELECTS-01 (2026-09-05). This mutation was
  # already written INSIDE test-status-churn.sh as its own built-in control,
  # and it had stopped firing: the fixture symlinked leadv2-state-path.sh into
  # a bare directory without the sibling it sources, so every invocation of the
  # mutated library exited 1 before writing anything, and the suite read the
  # resulting zero as "the mutation did not reproduce the race". Catalogued
  # now that it fires again -- 5 recomputes where 1 is correct.
  - id: status-snapshot-recomputes-without-the-lock
    product_flow: "five concurrent consumers of a stale status snapshot each recompute it instead of one, so a status read multiplies the work it was built to avoid"
    file: plugins/leadv2/scripts/lib/leadv2-status-cache.sh
    suite: plugins/leadv2/scripts/tests/test-status-churn.sh
    anchor: |
      fcntl.flock(lock_f.fileno(), fcntl.LOCK_EX | fcntl.LOCK_NB)
    patch: |
      drop the flock call, keeping `got_lock = True`, so every caller believes
      it won the race
    expected: killed
    note: "the suite carries this control itself; measured after the fixture repair: 5 recomputes vs 1. Selection proven from the production file -- clean tree 3 suites, one appended comment in lib/leadv2-status-cache.sh -> 4, incl. test-status-churn.sh"

  # FIVE-RED-SUITES-THE-GATE-SELECTS-01 (2026-09-05). The backlog pump could
  # not reserve a single lane. Every other caller of the registry goes through
  # the leadv2_active_register wrapper and was carried along when the registry
  # gained its 16th positional field; this one call site had pinned the
