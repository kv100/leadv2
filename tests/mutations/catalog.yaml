      i.e. every lane-caused regression is laundered and the gate stops killing

  - id: gate-launders-a-suite-the-lane-itself-added
    product_flow: "the e2e gate (leadv2-dispatch-product-close.sh / leadv2-phase8-e2e-gate.sh) kills a lane on reason=e2e_regression. Ownership alone asks 'does this suite fail with only YOUR files?', which is still yes for a suite that was ALREADY red before the lane branched -- so main's inherited reds were charged to whoever dispatched next. HARNESS-COSTS-MORE-THAN-IT-CATCHES-01 re-runs every own-classified suite against the lane's own merge-base tree and moves the ones already red there into pre_existing. The paired obligation is the other colour: a suite the lane genuinely broke must still land in own and must still kill the lane"
    file: plugins/leadv2/scripts/leadv2-e2e-ownership.sh
    suite: plugins/leadv2/scripts/tests/test-e2e-gate-ignores-pre-existing-red.sh
    anchor: |
      still_own+=("${suite}")   # absent at merge-base
    patch: |
      s|still_own+=("\${suite}")   # absent at merge-base|pre_existing+=("\${suite}")   # absent|
      -- a suite the lane ADDED cannot have been red before it existed; treating it as
      pre-existing excuses brand-new breakage

  - id: gate-fails-open-when-the-baseline-budget-is-spent
    product_flow: "the e2e gate (leadv2-dispatch-product-close.sh / leadv2-phase8-e2e-gate.sh) kills a lane on reason=e2e_regression. Ownership alone asks 'does this suite fail with only YOUR files?', which is still yes for a suite that was ALREADY red before the lane branched -- so main's inherited reds were charged to whoever dispatched next. HARNESS-COSTS-MORE-THAN-IT-CATCHES-01 re-runs every own-classified suite against the lane's own merge-base tree and moves the ones already red there into pre_existing. The paired obligation is the other colour: a suite the lane genuinely broke must still land in own and must still kill the lane"
    file: plugins/leadv2/scripts/leadv2-e2e-ownership.sh
    suite: plugins/leadv2/scripts/tests/test-e2e-gate-ignores-pre-existing-red.sh
    anchor: |
      still_own+=("${suite}")   # unmeasured is not innocent
    patch: |
      s|still_own+=("\${suite}")   # unmeasured is not innocent|pre_existing+=("\${suite}")   # unmeasured|
      -- once LEADV2_E2E_BASELINE_BUDGET_S is spent the remaining suites are UNMEASURED,
      and unmeasured must never mean innocent

  - id: gate-never-recognises-an-inherited-red
    product_flow: "the e2e gate (leadv2-dispatch-product-close.sh / leadv2-phase8-e2e-gate.sh) kills a lane on reason=e2e_regression. Ownership alone asks 'does this suite fail with only YOUR files?', which is still yes for a suite that was ALREADY red before the lane branched -- so main's inherited reds were charged to whoever dispatched next. HARNESS-COSTS-MORE-THAN-IT-CATCHES-01 re-runs every own-classified suite against the lane's own merge-base tree and moves the ones already red there into pre_existing. The paired obligation is the other colour: a suite the lane genuinely broke must still land in own and must still kill the lane"
    file: plugins/leadv2/scripts/leadv2-e2e-ownership.sh
    suite: plugins/leadv2/scripts/tests/test-e2e-gate-ignores-pre-existing-red.sh
    anchor: |
      pre_existing+=("${suite}")     # red before the lane touched anything.
    patch: |
      s|pre_existing+=("\${suite}")     # red before|still_own+=("\${suite}")     # red before|
      -- the subtraction itself disabled: back to charging every lane for main's
      inherited reds, which is exactly the pre-fix behaviour

  - id: mutation-runner-cannot-see-the-lanes-own-uncommitted-file
    product_flow: "leadv2-mutation-control.sh is the instrument that proves a suite is real, so what it measures has to be a tree somebody chose. CHALLENGE-05 correctly required a lane's UNCOMMITTED target/suite files to be visible, and fixed that by snapshotting the whole working tree (ls-files -co) -- which in a shared checkout with five live sessions also drags in every other lane's half-finished file, so a mutation can read killed or survived for a reason nobody declared (MUTATION-RUNNER-STAGES-EVERYTHING-01). The snapshot is now HEAD plus the mutation's file, the suite, and LEADV2_MUTCTL_OVERLAY; excluded dirty files are counted out loud, and LEADV2_MUTCTL_SNAPSHOT=worktree restores the old behaviour"
    file: plugins/leadv2/scripts/leadv2-mutation-control.sh
    suite: plugins/leadv2/scripts/tests/test-mutation-runner-measures-only-declared-files.sh
    anchor: |
      for _d in "${_mc_declared[@]}"; do _mc_overlay "${_d}"; done
    patch: |
      s|for _d in "\${_mc_declared\[@\]}"; do _mc_overlay "\${_d}"; done|: # MUTANT|
      -- the declared file's uncommitted state never reaches the scratch, so the baseline is
      not green and nothing is measured at all -- CHALLENGE-05's regression, restored

  - id: mutation-runner-measures-every-other-lanes-dirty-file
    product_flow: "leadv2-mutation-control.sh is the instrument that proves a suite is real, so what it measures has to be a tree somebody chose. CHALLENGE-05 correctly required a lane's UNCOMMITTED target/suite files to be visible, and fixed that by snapshotting the whole working tree (ls-files -co) -- which in a shared checkout with five live sessions also drags in every other lane's half-finished file, so a mutation can read killed or survived for a reason nobody declared (MUTATION-RUNNER-STAGES-EVERYTHING-01). The snapshot is now HEAD plus the mutation's file, the suite, and LEADV2_MUTCTL_OVERLAY; excluded dirty files are counted out loud, and LEADV2_MUTCTL_SNAPSHOT=worktree restores the old behaviour"
    file: plugins/leadv2/scripts/leadv2-mutation-control.sh
    suite: plugins/leadv2/scripts/tests/test-mutation-runner-measures-only-declared-files.sh
    anchor: |
      if [[ "${LEADV2_MUTCTL_SNAPSHOT:-head}" == "worktree" ]]; then
    patch: |
      s|LEADV2_MUTCTL_SNAPSHOT:-head|LEADV2_MUTCTL_SNAPSHOT:-worktree|
      -- the default goes back to snapshotting the whole working tree, so an undeclared dirty
      file from a neighbouring lane decides the verdict

  - id: judge-shaped-agent-guard-notices-nothing
    product_flow: "when leadv2-review-run.sh refuses another review round (status: blocked, reason: review_roundcap / review_spawncap) the lead needs a judge, and the plugin has one -- the leadv2-judge skill. On 2026-09-02 the lead hit the cap twice and both times hand-wrote a ~400-word Agent(leadv2:critic, opus) prompt instead, losing the verdict vocabulary, the mode contract and the record. LEAD-USES-ITS-OWN-TOOLS-01 names the remedy in the refusal itself and adds a WARN-only PreToolUse notice on judge-shaped Agent prompts. Note the filed row blamed a script leadv2-judge.sh that has never existed in this repo's history: the capability is a skill, and the guard points at the skill"
    file: plugins/leadv2/hooks/leadv2-judge-shaped-agent-guard.sh
    suite: plugins/leadv2/scripts/tests/test-judge-shaped-agent-guard.sh
    anchor: |
      grep -qiE 'VERDICT:|round cap|roundcap|LAND or FIX-ROUND'
    patch: |
      s/VERDICT:|round cap|roundcap|LAND or FIX-ROUND/ZZZ_NEVER_MATCHES/
      -- the judge-shape vocabulary never matches, so a hand-written judge prompt
      draws no notice; case (b), ordinary prose staying silent, must remain green

  - id: roundcap-refusal-stops-naming-the-remedy
    product_flow: "when leadv2-review-run.sh refuses another review round (status: blocked, reason: review_roundcap / review_spawncap) the lead needs a judge, and the plugin has one -- the leadv2-judge skill. On 2026-09-02 the lead hit the cap twice and both times hand-wrote a ~400-word Agent(leadv2:critic, opus) prompt instead, losing the verdict vocabulary, the mode contract and the record. LEAD-USES-ITS-OWN-TOOLS-01 names the remedy in the refusal itself and adds a WARN-only PreToolUse notice on judge-shaped Agent prompts. Note the filed row blamed a script leadv2-judge.sh that has never existed in this repo's history: the capability is a skill, and the guard points at the skill"
    file: plugins/leadv2/scripts/leadv2-review-run.sh
    suite: plugins/leadv2/scripts/tests/test-judge-shaped-agent-guard.sh
    anchor: |
      reason: review_roundcap\nrounds: %s\nmax_rounds: %s\nescalation: %s/review-roundcap-escalation.md\nremedy: Skill(leadv2-judge) mode=review\n
    patch: |
      drop the trailing `\nremedy: Skill(leadv2-judge) mode=review` from the round-cap
      printf -- the refusal goes back to describing a situation without naming an
      action; case (g), the cap still exiting 8, must remain green

  - id: journal-ignores-the-root-the-caller-pinned
    product_flow: "leadv2-journal.sh addresses every task journal, for writers and readers alike. Its root chain was CLAUDE_PROJECT_ROOT > CLAUDE_PROJECT_DIR > cwd, and LEADV2_PROJECT_ROOT -- the variable the rest of leadv2 uses to pin a root -- was not in it at all. A suite that isolates itself by exporting LEADV2_PROJECT_ROOT was therefore ignored and its write fell through to the cwd checkout: measured as docs/leadv2/tasks/dispatch-WSOTEST2/journal.md in the live tree, written by test-writeset-pending-overlap.sh, which pins the variable on every one of its call sites (TESTS-POLLUTE-REAL-JOURNAL-01). The rung was added AFTER both CLAUDE_* ones and BEFORE the cwd fallback, so the production path -- which sets CLAUDE_PROJECT_ROOT deliberately to keep a foreign-root dispatch out of the losing repo's journal -- is unchanged"
    file: plugins/leadv2/scripts/leadv2-journal.sh
    suite: plugins/leadv2/scripts/tests/test-journal-honours-the-pinned-root.sh
    anchor: |
      ${CLAUDE_PROJECT_DIR:-${LEADV2_PROJECT_ROOT:-$(git rev-parse --show-toplevel 2>/dev/null || pwd)}}
    patch: |
      s|CLAUDE_PROJECT_DIR:-\${LEADV2_PROJECT_ROOT:-|CLAUDE_PROJECT_DIR:-|  (and the matching elif)
      -- the LEADV2_PROJECT_ROOT rung is deleted and a pinned write falls through to cwd again
      -- measured under the mutation as .ephemeral/cwd-repo/, i.e. the live checkout

  - id: journal-lets-an-ambient-pin-beat-an-explicit-one
    product_flow: "leadv2-journal.sh addresses every task journal, for writers and readers alike. Its root chain was CLAUDE_PROJECT_ROOT > CLAUDE_PROJECT_DIR > cwd, and LEADV2_PROJECT_ROOT -- the variable the rest of leadv2 uses to pin a root -- was not in it at all. A suite that isolates itself by exporting LEADV2_PROJECT_ROOT was therefore ignored and its write fell through to the cwd checkout: measured as docs/leadv2/tasks/dispatch-WSOTEST2/journal.md in the live tree, written by test-writeset-pending-overlap.sh, which pins the variable on every one of its call sites (TESTS-POLLUTE-REAL-JOURNAL-01). The rung was added AFTER both CLAUDE_* ones and BEFORE the cwd fallback, so the production path -- which sets CLAUDE_PROJECT_ROOT deliberately to keep a foreign-root dispatch out of the losing repo's journal -- is unchanged"
    file: plugins/leadv2/scripts/leadv2-journal.sh
    suite: plugins/leadv2/scripts/tests/test-journal-honours-the-pinned-root.sh
    anchor: |
      PROJECT_ROOT="${CLAUDE_PROJECT_ROOT:-${CLAUDE_PROJECT_DIR:-${LEADV2_PROJECT_ROOT:-
    patch: |
      reorder the chain so LEADV2_PROJECT_ROOT comes FIRST
      -- an ambient LEADV2_PROJECT_ROOT overrides an explicit CLAUDE_* pin, which is exactly the
      foreign-root regression the ordering exists to prevent; case (a2) goes red

  - id: foreign-check-goes-silent-when-it-cannot-check
    product_flow: "leadv2-reply-router.sh refuses an answer to a young question owned by another session (QUESTION-DELIVERY-OWNERSHIP-01). Its first branch fails open on a row with no owner_session, commented 'old row (pre-OWNERSHIP)'. That branch is not the exception, it is the whole population: leadv2-ask.sh:176 fills owner_session from LEADV2_ASK_OWNER_SESSION or CLAUDE_SESSION_ID, neither is set in the asking process, and owner_session is written as null in every one of the 8283 rows that carry it (8057 under ~/.claude/leadv2-state/*/questions/, 226 under docs/leadv2/questions/, zero non-null anywhere) -- yaml null reads back as the empty string, so the branch takes every call. So the protection has never once engaged -- and returned success without a word, which from the outside is indistinguishable from 'checked, and it is yours'. The fix does not close the gap with a wall; it makes the blind path say so"
    file: plugins/leadv2/scripts/leadv2-reply-router.sh
    suite: plugins/leadv2/scripts/tests/test-guard-says-when-it-could-not-check.sh
    anchor: |
      reason=no_owner_session — allowing, but nothing was verified
    patch: |
      delete the UNAVAILABLE printf inside the empty-owner branch of _foreign_check
      -- the guard is silent again on the path it takes for 100% of real rows; case (a) goes red,
      case (c) stays green (the protection itself is untouched). Measured: 4/1

  - id: foreign-check-answers-an-empty-input-with-a-wall
    product_flow: "The paired half of the same fix, and the more important one. Every real question row lacks owner_session, so a guard that answered its blind input with a refusal would block every answer on the machine rather than protect anything. Naming a gap is not licence to close it: the empty-owner branch must keep returning 0. This mutation is the one that catches a 'fix' that turns a self-disabled guard into a wall"
    file: plugins/leadv2/scripts/leadv2-reply-router.sh
    suite: plugins/leadv2/scripts/tests/test-guard-says-when-it-could-not-check.sh
    anchor: |
      reason=no_owner_session — allowing, but nothing was verified
    patch: |
      change the empty-owner branch inside _foreign_check from `return 0` to `return 6`
      -- case (b) goes red while (c),(d),(e) stay green, so the suite separates 'the guard speaks'
      from 'the guard blocks'. Measured: 3/2

  - id: kimi-handle-recovered-by-halving-a-string
    product_flow: "The kimi arm of _spawn_worker_body recovered a worker handle by stripping to the last slash-segment of the launcher's stdout and then taking the FIRST HALF of it by character count, on the stated assumption that kimi-coder.sh prints \"$RUNS/$handle$handle\". Measured against the launcher itself: cmd_bg ends with a bare `echo \"${run_id}\"` (kimi-coder.sh:94) -- one copy, no path prefix, exactly like glm-coder.sh, whose identical halving was removed under GLM-ARM-THROUGHPUT-01 after it truncated every handle into a string `status` could never resolve, so that arm never launched a worker through the router at all. A parser that recovers a value by halving a string holds only while the launcher's last line is exactly the doubled form, and nothing asserted that"
    file: plugins/leadv2/scripts/leadv2-dispatch-code.sh
    suite: plugins/leadv2/scripts/tests/test-spawn-handle-parse.sh
    anchor: |
      handle="${out%$'\n'}"
    patch: |
      inside the kimi case block, replace the assignment with the old halving:
        local _kimi_out="${out%$'\n'}"; local _kimi_temp="${_kimi_out##*/}"
        local _kimi_half=$(( ${#_kimi_temp} / 2 )); handle="${_kimi_temp:0:_kimi_half}"
      -- the suite goes 6/6: the real launcher's handle no longer round-trips through
      `status` (c2), and all three synthetic shapes come back halved (d). Measured
      both ways: 12/0 on the fixed tree, 6/6 against a mutated copy passed through
      KIMI_HANDLE_SUITE_DISPATCH. The suite's own control refuses to self-pass when
      the source is already halving (mut_rc check), so a mutated tree cannot read green.
