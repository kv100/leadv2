# Production-mutation catalog for leadv2 (BACKLOG-ONLY-GROWS-CLOSING-IS-MANUAL-01).
#
# Schema mirrors persona-engine's tests/mutations/catalog.yaml (the only prior
# catalog in the fleet): one entry per known production-behaviour mutation.
# This repo's canonical mutation runner is plugins/leadv2/scripts/
# leadv2-mutation-control.sh — it applies the mutation in a scratch copy of
# the lane, runs the named suite against it, and requires the suite to go RED
# (killed). An entry is NEVER deleted to make the kill rate look better; if an
# anchor rots, fix the anchor.
#
# Baseline: 3/3 killed on 2026-09-04 (artifacts under
# docs/handoff/BACKLOG-ONLY-GROWS-CLOSING-IS-MANUAL-01/mutation-control/).
# 2026-09-04 PHASE-GATE-DEFAULT-CLASS-ESCAPES-IT-01: +5 entries, 8/8 killed
# (artifacts under docs/handoff/PHASE-GATE-DEFAULT-CLASS-ESCAPES-IT-01/
# mutation-control/; the warn-trace control ran as a unified-diff patch —
# macOS BSD sed degenerates its `${...}`-bearing anchor into an empty match).
# 2026-09-05 ARBITER-REMEMBERS-FAILURES-01: +2 entries, 10/10 killed (artifacts
# under docs/handoff/ARBITER-REMEMBERS-FAILURES-01/mutation-control/ — two
# leadv2-mutation-control.sh runs, plus run.sh, an independent harness whose log
# shows WHICH cases each mutation reddens; note that the canonical runner's
# `red_line=` field quoted a PASS line on the second control, so read the verdict
# from its exit status and from negative-controls.log, not from that field).
# 2026-09-05 PHASE-GATE-NAMES-EVERYTHING-AT-ONCE-01: +2 entries, both killed
# (artifacts under docs/handoff/PHASE-GATE-NAMES-EVERYTHING-AT-ONCE-01/
# mutation-control/).
#
# THE RUNNING TOTAL IN THIS HEADER WAS WRONG AND IS NOW DERIVED, NOT CARRIED.
# The line here used to read "now 8/8" while the file already held ELEVEN
# entries: the three smart-arbiter-* rows were added without updating it. Both
# 2026-09-05 lanes then incremented the stale number (10/10, 12/12) instead of
# counting. Corrected 2026-09-05 by counting: **15 entries, all expected:
# killed.** Do not increment this sentence — recount it:
#     python3 -c "import yaml;d=yaml.safe_load(open('tests/mutations/catalog.yaml'));\
#                 print(len(d['mutations']))"
# An entry is never deleted to make the number look better; a number that is
# carried instead of measured is the same disease one layer up.

mutations:
  - id: phase8-backlog-row-call-removed
    product_flow: "lane close on a success outcome removes its founder backlog row (the seam call itself)"
    file: plugins/leadv2/scripts/leadv2-phase8-close.sh
    anchor: |
      if ! bash "${_p8c_row_bin}" "${_p8c_row_sid}" \
    patch: |
      if ! true \
    expected: killed

  - id: phase8-backlog-row-closes-on-refused
    product_flow: "non-success outcomes (refused, no_work) must leave the backlog row open"
    file: plugins/leadv2/scripts/leadv2-phase8-close.sh
    anchor: |
      if [[ "${OUTCOME}" == "completed_success" || "${OUTCOME}" == "completed_with_warnings" ]]; then
    patch: |
      if true; then
    expected: killed

  - id: phase8-backlog-row-ambiguous-resolves-first
    product_flow: "a founder task resolving to >=2 backlog rows closes NOTHING (never a partial/first match)"
    file: plugins/leadv2/scripts/leadv2-phase8-close.sh
    anchor: |
      hits = [it for it in items if isinstance(it, dict) and row_matches(it, founder)]
    patch: |
      hits = [it for it in items if isinstance(it, dict) and row_matches(it, founder)][:1]
    expected: killed

  # PHASE-GATE-DEFAULT-CLASS-ESCAPES-IT-01 (2026-09-04) — the phase gate's
  # permissive default and its silent passages.
  - id: phase-gate-canonicalizes-class-before-mode
    product_flow: "an unrecognized class spelling reaching the phase gate (ledger-borne lowercase heavy, garbage) is canonicalized and ENFORCED, never silently warned"
    file: plugins/leadv2/scripts/leadv2-dispatch-code.sh
    anchor: |
      cls="$(_lv2_class_canonical "${cls}")"
    patch: |
      cls="${cls}"
    expected: killed

  - id: phase-gate-warn-leaves-a-trace
    product_flow: "warn mode journals phase_precondition_warn with class and missing phases on every rc=3 passage"
    file: plugins/leadv2/scripts/leadv2-dispatch-code.sh
    anchor: |
      && emit decision "phase_precondition_warn task=${sig8} class=${cls} missing=${missing_csv} mode=warn"
    patch: |
      && emit decision "phase_precondition_nowarn task=${sig8} class=${cls} missing=${missing_csv} mode=warn"
    expected: killed

  - id: phase-gate-light-trivial-keep-warn
    product_flow: "Light/Trivial keep the historical warn default — the gate is correct, not merely strict"
    file: plugins/leadv2/scripts/leadv2-dispatch-code.sh
    anchor: |
      Light|Trivial)
    patch: |
      LightTrivialDisabled)
    expected: killed

  - id: phase-gate-pass-leaves-a-trace
    product_flow: "a satisfied pass journals phase_precondition_pass"
    file: plugins/leadv2/scripts/leadv2-dispatch-code.sh
    anchor: |
      emit decision "phase_precondition_pass task=${sig8} class=${cls} mode=${mode} scope=${scope}"
    patch: |
      : # pass trace removed
    expected: killed

  - id: phase-gate-bootstrap-leaves-a-trace
    product_flow: "a bootstrap admission journals phase_precondition_bootstrap with class and would_be_missing (the dispatch-96d97702 silent hole)"
    file: plugins/leadv2/scripts/leadv2-dispatch-code.sh
    anchor: |
      emit decision "phase_precondition_bootstrap task=${sig8} class=${cls} would_be_missing=${_boot_csv} mode=${mode} scope=${scope}"
    patch: |
      : # bootstrap trace removed
    expected: killed

  # SMART-ARBITER-01 — three fixes, one control each (2026-09-04).
  # Evidence base: 569 live `route_resolved by=arbiter` journal lines, 190
  # from 2026-09-03/04 (census: docs/handoff/SMART-ARBITER-01/census.md).

  - id: smart-arbiter-effort-task-first
    product_flow: "effort follows the TASK: task-keyed effort_matrix rows (kinds/sizes/complexity/duration_class/protected) are evaluated before arm-tag rows, so a standard build won by glm-flash resolves medium, never low from the arm's cheap/mechanical tags (43 live build decisions at effort=low, 2026-09-03/04)"
    file: plugins/leadv2/scripts/lib/leadv2-route-arbiter.sh
    anchor: |
      for _row in (_task_rows+_arm_rows):
    patch: |
      for _row in (_arm_rows):
    expected: killed

  - id: smart-arbiter-canonical-protected-glm
    product_flow: "canonical sonnet_exceptions carries no protected_path row: protected/safety tasks resolve glm primary (GLM-DOES-ANY-WORK-01, founder 2026-09-04) while every kept exception still fires sonnet (84 sonnet-at-cost-5 live decisions 2026-09-03/04 with glm idle)"
    file: plugins/leadv2/config/leadv2-routing.yaml
    anchor: |
      sonnet_exceptions:
    patch: |
      sonnet_exceptions:
        - id: safety_gate_publish_payments
          when: protected_path
    expected: killed

  - id: smart-arbiter-route-reason-token
    product_flow: "route_resolved journal keeps reason=cheapest_capable when floor tokens ride the same line: the capture is anchored on a space-prefixed reason=, not the greedy last reason= token (23 corrupted live decision lines on 2026-09-04)"
    file: plugins/leadv2/scripts/leadv2-dispatch-code.sh
    anchor: |
      _arb_reason="$(printf '%s\n' "${_arb_out}" | sed -n 's/.*[[:space:]]reason=\([^ ]*\).*/\1/p')"
    patch: |
      _arb_reason="$(printf '%s\n' "${_arb_out}" | sed -n 's/.*reason=\([^ ]*\).*/\1/p')"
    expected: killed

  # ARBITER-REMEMBERS-FAILURES-01 (founder 2026-09-05). Both anchors sit INSIDE a
  # function body of the arbiter's python heredoc, so the mutant changes routing
  # behaviour rather than merely breaking the file — a top-level insert would
  # redden every suite for the wrong reason and read like a successful control.
  - id: arbiter-failure-memory-stops-counting
    product_flow: "an arm that spawned and produced nothing twice on THIS task signature must lose its turn to the next arm in the chain"
    file: plugins/leadv2/scripts/lib/leadv2-route-arbiter.sh
    suite: plugins/leadv2/scripts/tests/test-route-arbiter-failure-memory.sh
    anchor: |
      if arm: counts[arm]=counts.get(arm,0)+1
    patch: |
      if arm: pass
    expected: killed
    note: "kills 4 cases (the ban, its absence from chain=, threshold=2, all-banned yielding); every edit-B case stays green, so the control is specific"

  - id: arbiter-unknown-is-capped-again
    product_flow: "a provider whose quota probe did not answer is NOT a busy provider: it stays selectable (demoted) and is named by probe_outage= instead of being absorbed into all_arms_capped"
    file: plugins/leadv2/scripts/lib/leadv2-route-arbiter.sh
    suite: plugins/leadv2/scripts/tests/test-route-arbiter-failure-memory.sh
    anchor: |
      if unk.get(provider): return False
    patch: |
      if False: return False
    expected: killed
    note: "kills exactly 1 case (probe outage still refused); every edit-A case stays green. Reproduces the measured production bug: util_codex=unknown_capped in 122 of 143 decisions, six lanes killed by all_arms_capped when the instrument failed, not the quota"

  # PHASE-GATE-NAMES-EVERYTHING-AT-ONCE-01 (2026-09-05). Both anchors are inside
  # a function body of leadv2-phase-record.sh, and each control is specific: the
  # first reddens only the name-the-contract cases, the second only the
  # refuse-the-dead-record cases.
  - id: phase-gate-names-only-its-own-scope
    product_flow: "one refusal must name the class's WHOLE mandatory contract, so no phase is ever discovered by re-dispatching (each discovery cost a full dispatch cycle, ~2 min)"
    file: plugins/leadv2/scripts/leadv2-phase-record.sh
    suite: plugins/leadv2/scripts/tests/test-phase-gate-names-everything.sh
    anchor: |
      required_full[*]
    patch: |
      required_full_DISABLED[*]
    expected: killed
    note: "kills 4 cases (a1,a2,a4,a5); every defect-2 case stays green. The anchor deliberately avoids a ${...}-bearing pattern — macOS BSD sed degenerates those into an empty match"

  - id: phase-record-writes-the-dead-record-anyway
    product_flow: "a `done` record whose artifact cannot hash is knowably dead at write time and must refuse, writing nothing — writing it ends the lane's bootstrap grace without satisfying the gate, turning an admissible lane into a refused one"
    file: plugins/leadv2/scripts/leadv2-phase-record.sh
    suite: plugins/leadv2/scripts/tests/test-phase-gate-names-everything.sh
    anchor: |
      exit 5
    patch: |
      _proof="unverified"
    expected: killed
    note: "kills 3 cases (b1,b2,b5); every defect-1 case stays green. b5 shows the real harm: with the record written, the very next assert refuses (missing=classify,plan,gate1) instead of admitting the lane at bootstrap"
